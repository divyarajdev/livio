name: "💡 Feature Request"
description: "Propose a scoped feature or behavior change"
title: "[Feature]: "
labels:
  - enhancement
  - needs-triage
type: feature  

body:
  # Purpose and routing
  - type: markdown
    attributes:
      value: |
        Use this form for a scoped new capability or change to existing behavior.

        Use the Bug Report form for reproducible defects.
        Use the Q&A category for usage, configuration, or implementation questions.
        Use the Documentation Request form for documentation changes.
        Use the Ideas category for proposals that still require problem or scope exploration.

  # Pre-submission checks
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing open and closed issues, discussions, and project documentation for this request or an existing solution.
          required: true
        - label: This request covers one scoped capability or behavior change.
          required: true
        - label: >-
            I am not publicly disclosing a security vulnerability, and I removed
            credentials, authentication tokens, private endpoints, personal data,
            and other sensitive data from this request and its attachments.
          required: true

  # Request scope
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the technical area most directly affected by the request.
      options:
        - Core functionality
        - UI or UX
        - Accessibility
        - Settings or configuration
        - Notifications
        - Data or storage
        - Networking or synchronization
        - Privacy or security
        - Performance or battery
        - Integrations
        - Developer API or SDK
        - Build, tooling, or developer experience
        - Localization
        - Other
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Specific component or module
      description: Identify the affected screen, feature, API, package, service, or Gradle module.
      placeholder: "Example: Settings > Appearance, sync API, or :feature:home"

  # Problem definition
  - type: textarea
    id: problem
    attributes:
      label: Problem and affected workflow
      description: Describe the current limitation, who or what it affects, when it occurs, and the resulting user or developer impact. Do not prescribe the implementation here.
      placeholder: |
        Current limitation:
        Affected users or workflow:
        Conditions:
        Impact:
    validations:
      required: true

  # Requested behavior
  - type: textarea
    id: proposed-solution
    attributes:
      label: Requested outcome
      description: Describe the observable behavior or capability required to resolve the problem. Define success without prescribing internal implementation unless an architectural constraint requires it.
      placeholder: |
        Required behavior:
        Success conditions:
        - ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: List existing capabilities, workarounds, or approaches evaluated and explain why they are insufficient.
      placeholder: |
        Existing capability or workaround:
        Limitation:
        Alternative approach considered:

  # Android scope
  - type: dropdown
    id: android-target
    attributes:
      label: Affected Android targets
      description: Select every runtime or form factor affected by the request.
      multiple: true
      options:
        - All targets or platform-independent
        - Android phones
        - Tablets
        - Foldables
        - Wear OS
        - Android TV or Google TV
        - Android Automotive OS or Android Auto
        - Other

  # Technical evaluation
  - type: textarea
    id: technical-considerations
    attributes:
      label: Technical constraints
      description: Identify known constraints that affect feasibility, compatibility, implementation, or acceptance.
      placeholder: |
        Android versions or API levels:
        Permissions or platform restrictions:
        Accessibility:
        Privacy or security:
        Performance, battery, network, or storage:
        Data migration or backward compatibility:
        Public API or SDK compatibility:
        Localization:

  # Supporting evidence
  - type: upload
    id: supporting-files
    attributes:
      label: Mockups, diagrams, or supporting files
      description: Upload files required to clarify the requested behavior, interaction, or technical constraints.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.pdf,.mp4,.webm"

  - type: textarea
    id: references
    attributes:
      label: Related work and references
      description: Link related issues, discussions, pull requests, documentation, specifications, or comparable implementations.
      placeholder: |
        Related issue or discussion:
        Documentation or specification:
        Comparable implementation:
        Other reference:

  # Contribution
  - type: dropdown
    id: contribution
    attributes:
      label: Implementation contribution
      description: Select whether you can prepare an implementation after the scope is agreed.
      options:
        - I can prepare an implementation
        - I may contribute with technical guidance
        - I am not planning to implement it
