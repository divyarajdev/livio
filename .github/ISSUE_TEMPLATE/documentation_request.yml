name: "📚 Documentation Request"
description: "Report incorrect, outdated, missing, or unclear documentation"
title: "[Docs]: "
labels:
  - documentation
  - needs-triage
 type: docs 

body:
  # Purpose and routing
  - type: markdown
    attributes:
      value: |
        Use this form for incorrect, outdated, missing, or unclear project documentation.

        Use the Bug Report form for reproducible defects.
        Use the Feature Request form for scoped capability or behavior changes that are ready for project triage.
        Use the Q&A category for questions about usage, configuration, integration, builds, or troubleshooting.
        Use the Ideas category to explore early-stage proposals.

        For a small and unambiguous correction, a direct pull request is preferred.

  # Pre-submission checks
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      options:
        - label: I checked the current documentation and searched existing Issues and Discussions for this request.
          required: true
        - label: This submission covers one scoped documentation problem or addition.
          required: true
        - label: >-
            I am not publicly disclosing a security vulnerability, and I removed
            credentials, authentication tokens, private endpoints, personal data,
            and other sensitive data from this submission and its attachments.
          required: true

  # Request classification
  - type: dropdown
    id: request-type
    attributes:
      label: Request type
      description: Select the change that most directly describes the documentation problem.
      options:
        - Incorrect information
        - Outdated information
        - Missing information
        - Unclear or ambiguous explanation
        - Broken link or reference
        - Incorrect code, command, or configuration example
        - Typographical, grammar, or formatting error
        - New documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: documentation-area
    attributes:
      label: Documentation area
      description: Select every repository documentation area affected by the request.
      multiple: true
      options:
        - README
        - Setup
        - Development workflow
        - Architecture
        - Testing
        - Accessibility
        - Privacy
        - Security
        - Performance
        - Release process
        - Translation or localization
        - Troubleshooting
        - Contributing
        - Code or API documentation
        - Samples or examples
        - Other
    validations:
      required: true

  # Affected documentation
  - type: input
    id: affected-documentation
    attributes:
      label: Affected documentation location
      description: Provide the exact URL, repository path, or section. For new documentation, provide the proposed location.
      placeholder: "Example: docs/setup.md, README > Installation, or proposed docs/migration.md"
    validations:
      required: true

  - type: input
    id: affected-version
    attributes:
      label: Affected version or revision
      description: Provide the exact app, library, SDK, API, release, or commit revision when the problem is version-specific.
      placeholder: "Example: 2.4.0, Android API 36, or commit abc1234"

  # Documentation problem
  - type: textarea
    id: documentation-request
    attributes:
      label: Documentation problem
      description: Identify the current text, example, or omission and explain why it is incorrect, outdated, missing, or unclear.
      placeholder: |
        Current content or omission:
        Problem:
        Effect on the reader:
    validations:
      required: true

  # Required result
  - type: textarea
    id: desired-outcome
    attributes:
      label: Required correction
      description: State the accurate information, example, or explanation that the documentation must provide and what the reader should be able to do afterward.
      placeholder: |
        Required correction or information:
        Expected reader outcome:
    validations:
      required: true

  # Supporting evidence
  - type: textarea
    id: references
    attributes:
      label: Evidence and references
      description: Link authoritative documentation, source code, APIs, specifications, related Issues, or pull requests that support the requested correction.
      placeholder: |
        Source of truth:
        Related code or API:
        Related Issue or pull request:
        Other reference:

  - type: upload
    id: attachments
    attributes:
      label: Screenshots or supporting files
      description: Upload files required to identify, demonstrate, or verify the documentation problem.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.svg,.pdf,.txt"

  # Contribution
  - type: dropdown
    id: contribution
    attributes:
      label: Documentation contribution
      description: Select whether you can prepare the documentation change after the scope is agreed.
      options:
        - I can prepare the documentation change
        - I may contribute with technical guidance
        - I am not planning to prepare the change
