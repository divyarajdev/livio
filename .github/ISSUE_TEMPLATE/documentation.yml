name: 📚 Documentation
description: Report missing, incorrect, unclear, outdated, or incomplete documentation.
title: "[Docs]: "
labels:
  - documentation

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## 📚 Documentation

        Use this form to report missing, incorrect, unclear, outdated,
        incomplete, or broken documentation.

        Please provide enough information to identify the documentation
        problem, verify the reported issue, determine the expected
        correction, and validate the improvement.

        ### Before you submit

        - 🔎 Search existing Issues and Discussions for related reports.
        - 📚 Check the current documentation before submitting.
        - 🎯 Identify the relevant documentation location or topic.
        - 🧪 Explain how the documentation problem can be verified when relevant.
        - 🔗 Provide authoritative sources for factual or technical corrections.
        - 📱 Include Android-specific details when they affect the documentation.
        - 📎 Attach relevant screenshots or other evidence when useful.
        - 🔐 Remove passwords, tokens, private keys, personal information,
          and other sensitive data.
        - 🛡️ Do not publicly disclose security vulnerabilities.
        - 🐛 Use the Bug Report for confirmed reproducible application defects.
        - ✨ Use the Feature Request for new functionality or improvements.
        - 💬 Use Q&A for questions, guidance, or troubleshooting.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm these items before submitting.
      options:
        - label: I searched existing Issues and Discussions and did not find a duplicate.
          required: true
        - label: I checked the current documentation before submitting.
          required: true
        - label: This report does not publicly disclose a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # DOCUMENTATION LOCATION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🔍 Documentation location

        Identify where the documentation problem exists, or the topic
        where documentation is missing or needs improvement.

  - type: input
    id: documentation-location
    attributes:
      label: Documentation location / topic
      description: |
        Provide the URL, repository file path, section, heading,
        page, topic, affected feature, or other relevant location.

        If the documentation is completely missing, identify the
        topic or feature that should be documented.
      placeholder: |
        Example:
        docs/setup.md — "Installation" section

        Or:
        Backup encryption documentation
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Documentation issue type
      description: Select the type that best describes the problem.
      options:
        - Missing information
        - Incorrect information
        - Outdated information
        - Unclear or confusing information
        - Incomplete information
        - Broken link or reference
        - Typographical or grammatical error
        - Incomplete example
        - Poor organization or discoverability
        - Inconsistent information
        - Other
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # DOCUMENTATION PROBLEM
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 🎯 Documentation problem

        Describe what is wrong, missing, unclear, inconsistent,
        or outdated.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Explain the documentation problem clearly.

        Describe what is wrong, missing, unclear, inconsistent,
        or outdated and why the current documentation is insufficient.
      placeholder: |
        Example:
        The installation instructions do not explain the required
        Android permissions for a fresh installation.
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: Current content
      description: |
        Optional. Quote or summarize the relevant documentation when
        existing content is available.

        Keep quotations reasonably short and do not include
        passwords, tokens, private keys, personal information,
        or other sensitive data.
      placeholder: |
        Example:
        The documentation explains how to install the application
        but does not mention the permission required for the
        documented storage workflow.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # VERIFICATION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🧪 Verification

        Provide evidence when it helps the maintainer verify
        the documentation problem.

  - type: textarea
    id: verification
    attributes:
      label: Verification / evidence
      description: |
        Optional. Explain how the documentation problem can be verified.

        Include observed behavior, reproducible checks, screenshots,
        command output, official platform information, or other
        supporting evidence when relevant.
      placeholder: |
        Examples:
        - The documented command no longer works.
        - The behavior differs on Android 16.
        - The official Android documentation describes different behavior.
        - The referenced page no longer exists.
        - The screenshot no longer matches the current UI.
    validations:
      required: false

  - type: textarea
    id: affected-context
    attributes:
      label: Affected context
      description: |
        Optional. Identify the application version, documentation version,
        platform version, workflow, or conditions in which the
        documentation problem applies.
      placeholder: |
        Examples:
        - Current documentation
        - App version: 1.4.2
        - Android 16
        - New installation workflow
        - Documentation introduced in a specific release
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # EXPECTED DOCUMENTATION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. ✏️ Expected documentation

        Describe what the documentation should communicate
        and what the reader should be able to understand or do.

  - type: textarea
    id: expected-content
    attributes:
      label: Expected content
      description: |
        Describe the information, correction, clarification,
        example, or guidance that should be provided.
      placeholder: |
        Example:
        The documentation should explain which permissions are required,
        when they are requested, and what happens if they are denied.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        Optional. Define observable conditions that should be true when
        the documentation change is considered complete.

        Keep each criterion clear, specific, and verifiable.
      placeholder: |
        Example:
        - The required permissions are documented accurately.
        - The instructions match current Android behavior.
        - Relevant API-level differences are explained.
        - Referenced links are valid.
        - The documented steps can be followed successfully.
        - Examples match the current application behavior.
    validations:
      required: false

  - type: textarea
    id: suggested-wording
    attributes:
      label: Suggested wording
      description: |
        Optional. Provide proposed replacement text when you
        have a clear and accurate wording suggestion.
      placeholder: |
        Provide suggested documentation text here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # REFERENCES & SOURCES
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🔗 References & sources

        Provide sources or references that help verify the
        documentation and determine the correct information.

  - type: textarea
    id: authoritative-source
    attributes:
      label: Authoritative source
      description: |
        Optional for editorial changes.

        Strongly recommended for factual or technical corrections.
        Prefer official Android documentation, Android API references,
        project documentation, specifications, or other authoritative
        sources.
      placeholder: |
        Example:
        Official Android documentation or API reference supporting
        the proposed correction.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Related references
      description: |
        Optional. Include related Issues, Discussions, project files,
        examples, specifications, or other useful references.
      placeholder: |
        Add relevant references here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # ANDROID CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🤖 Android context

        Provide Android-specific information only when it affects
        the documentation problem.

  - type: textarea
    id: android-context
    attributes:
      label: Android-specific context
      description: |
        Optional. Include relevant Android API levels, permissions,
        storage behavior, lifecycle behavior, background execution,
        notifications, accessibility, device behavior, or platform
        restrictions.
      placeholder: |
        Examples:
        - Android/API level
        - Runtime permissions
        - Scoped storage
        - Background execution
        - Notification behavior
        - Android lifecycle behavior
        - Accessibility behavior
        - Device/manufacturer-specific behavior
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # TECHNICAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🔧 Technical context

        Add technical information only when it is relevant
        to verifying or correcting the documentation.

  - type: textarea
    id: technical-context
    attributes:
      label: Technical considerations
      description: |
        Optional. Include relevant APIs, commands, configuration,
        dependencies, compatibility requirements, build behavior,
        integrations, or other technical details.
      placeholder: |
        Examples:
        - Android API or framework behavior
        - Gradle/build configuration
        - Required commands
        - API usage
        - External dependencies
        - Compatibility requirements
        - Configuration requirements
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # ADDITIONAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 📝 Additional context

        Provide any additional information that may help verify
        or improve the documentation.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include screenshots, examples, related Discussions,
        design notes, or other information that may help verify
        or improve the documentation.
      placeholder: |
        Add any additional relevant information here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONTRIBUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🤝 Contribution

        Documentation improvements are welcome when they follow
        the project's documentation standards.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional.
      options:
        - label: I am willing to submit a documentation change if this report is accepted.
          required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 10. 🔐 Privacy & security

        Issues are normally public.

        Review all text, links, screenshots, examples, logs,
        and attachments before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      description: Confirm that this report is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this report and its attachments.
          required: true
        - label: I am not publicly disclosing a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful documentation report?

        **Where is the problem? → What is wrong or missing? → What is the**
        **current content? → How can it be verified? → What should the**
        **documentation communicate? → What sources support the correction?**
        **→ How can the improvement be validated?**

        Thank you for providing clear, relevant, and verifiable information
        that helps keep the project's documentation accurate, understandable,
        and useful.
