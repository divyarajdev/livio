name: "📚 Documentation"
description: "Report missing, incorrect, unclear, outdated, incomplete, or broken documentation."
title: "[Docs]: "
labels:
  - "documentation"

body:
  # ===========================================================================
  # 📚 INTRODUCTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # 📚 Documentation Report

        Thanks for helping keep the project's documentation accurate,
        understandable, and useful! 💙

        Use this form to report documentation that is **missing, incorrect,
        unclear, outdated, incomplete, inconsistent, or broken**.

        A useful documentation report identifies **where the problem is**,
        explains **what is wrong or missing**, and describes **what the
        documentation should communicate instead**.

        ### 🧭 Before you submit

        Please make sure that you:

        - 🔎 **Search existing Issues and Discussions** for related reports.
        - 📚 **Check the current documentation** before submitting.
        - 📍 **Identify the affected page, file, section, topic, or feature**.
        - 🎯 **Explain the documentation problem clearly**.
        - 🧪 **Provide verification or evidence** when it helps confirm the issue.
        - 🔗 **Prefer authoritative sources** for factual or technical corrections.
        - 🤖 **Include Android-specific details** only when they affect the documentation.
        - 📎 **Attach screenshots or supporting material** when useful.
        - 🐛 Use the **Bug Report** for reproducible application defects.
        - ✨ Use the **Feature Request** for new functionality or improvements.
        - 💬 Use **Q&A** for questions, guidance, or troubleshooting.

        > [!TIP]
        > ### 💡 Be specific
        >
        > A precise file path, heading, URL, screenshot, or short quotation can
        > make a documentation problem much faster to locate and verify.

        > [!WARNING]
        > ### 🔐 Security vulnerabilities
        >
        > **Do not disclose security vulnerabilities in a public issue.**
        > Follow the private disclosure process described in `SECURITY.md`.

        > [!IMPORTANT]
        > ### 🛡️ Protect sensitive information
        >
        > Issues and attachments are normally **publicly visible**.
        > Remove passwords, authentication tokens, API keys, private keys,
        > personal information, account details, and other sensitive data
        > before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checks"
      description: "Confirm that this documentation report is ready for review."
      options:
        - label: "I searched existing Issues and Discussions and did not find a duplicate."
          required: true

        - label: "I checked the current documentation before submitting."
          required: true

        - label: "This is a documentation issue, not a confirmed application bug, feature request, or support question."
          required: true

        - label: "This report does not publicly disclose a security vulnerability."
          required: true

  # ===========================================================================
  # 1️⃣ DOCUMENTATION LOCATION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 📍 Documentation location

        Help us identify **where the documentation problem exists**.

        If documentation is completely missing, identify the feature,
        workflow, concept, or topic that should be documented.

  - type: input
    id: documentation-location
    attributes:
      label: "📍 Documentation location / topic"
      description: |
        Provide the URL, repository file path, section, heading, page,
        feature, topic, or another precise location.

        If no documentation currently exists, name the subject that
        should be documented.
      placeholder: "Example: docs/setup.md — Installation section"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: "🧭 Documentation issue type"
      description: "Select the category that best describes the problem."
      options:
        - "Missing information"
        - "Incorrect information"
        - "Outdated information"
        - "Unclear or confusing information"
        - "Incomplete information"
        - "Broken link or reference"
        - "Typographical or grammatical error"
        - "Incorrect or incomplete example"
        - "Poor organization or discoverability"
        - "Inconsistent or conflicting information"
        - "Accessibility issue"
        - "Other"
    validations:
      required: true

  # ===========================================================================
  # 2️⃣ DOCUMENTATION PROBLEM
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 🎯 Documentation problem

        Explain **what is wrong, missing, unclear, inconsistent, or outdated**
        and why the current documentation is insufficient.

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem"
      description: |
        Clearly describe the documentation issue.

        Explain what a reader may misunderstand, be unable to find,
        or be unable to accomplish because of the current documentation.
      placeholder: |
        Example:
        The installation instructions explain how to install the application
        but do not document the permission required for the described
        storage workflow.
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: "📖 Current content"
      description: |
        Optional. Quote a short relevant excerpt or summarize what the
        documentation currently says.

        Keep quotations focused and review all content for sensitive
        information before submitting.
      placeholder: |
        Example:
        The current installation section describes the storage workflow,
        but it does not mention that an Android permission may be required.
    validations:
      required: false

  # ===========================================================================
  # 3️⃣ VERIFICATION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🧪 Verification

        Provide evidence when it helps us **confirm the documentation problem
        or reproduce the documented workflow**.

        > [!NOTE]
        > Editorial issues such as spelling or wording usually do not require
        > extensive verification.

  - type: textarea
    id: verification
    attributes:
      label: "🧪 Verification / evidence"
      description: |
        Optional. Explain how the documentation problem can be verified.

        Include observed behavior, reproducible checks, command output,
        platform documentation, or other focused evidence when relevant.
      placeholder: |
        Examples:
        - The documented command no longer produces the described result.
        - The behavior differs on Android 16.
        - The linked page returns an error.
        - The screenshot no longer matches the current application.
        - Official Android documentation describes different behavior.
    validations:
      required: false

  - type: textarea
    id: affected-context
    attributes:
      label: "🧩 Affected context"
      description: |
        Optional. Identify versions, platforms, configurations, workflows,
        or other conditions under which the documentation issue applies.
      placeholder: |
        Examples:
        - Current documentation
        - App version: 1.4.2
        - Android 16 (API 36)
        - Fresh installation workflow
        - Documentation introduced in version 1.3.0
    validations:
      required: false

  # ===========================================================================
  # 4️⃣ EXPECTED DOCUMENTATION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. ✏️ Expected documentation

        Describe **what the corrected documentation should communicate**
        and what the reader should be able to understand or accomplish.

  - type: textarea
    id: expected-content
    attributes:
      label: "✨ Expected content"
      description: |
        Describe the correction, clarification, missing information,
        example, or guidance that should be provided.

        Focus on the intended documentation outcome rather than requiring
        exact wording.
      placeholder: |
        Example:
        The documentation should explain which permissions are required,
        when they are requested, why they are needed, and what behavior
        to expect when permission is denied.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Acceptance criteria"
      description: |
        Optional. Define observable conditions that should be true when
        the documentation improvement is complete.

        Keep each criterion clear, specific, and verifiable.
      placeholder: |
        Example:
        - Required permissions are documented accurately.
        - Instructions match current Android behavior.
        - Relevant API-level differences are explained.
        - Referenced links resolve successfully.
        - The documented workflow can be followed successfully.
        - Examples match current application behavior.
        - Accessibility considerations are documented where relevant.
    validations:
      required: false

  - type: textarea
    id: suggested-wording
    attributes:
      label: "✍️ Suggested wording"
      description: |
        Optional. Provide proposed wording when you already have a concise
        and accurate correction.

        Suggested text may be adapted to match the project's documentation
        style and terminology.
      placeholder: |
        Add suggested documentation text here.
    validations:
      required: false

  # ===========================================================================
  # 5️⃣ REFERENCES & SOURCES
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🔗 References & sources

        Provide sources that help establish **what the documentation should
        say and why**.

        For factual or technical corrections, authoritative sources are
        especially valuable.

  - type: textarea
    id: authoritative-source
    attributes:
      label: "🏛️ Authoritative source"
      description: |
        Optional for editorial changes; strongly recommended for factual
        or technical corrections.

        Prefer official Android documentation, Android API references,
        project documentation, standards, specifications, or other
        primary sources.
      placeholder: |
        Example:
        Official Android API documentation describing the relevant behavior.
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: "🔗 Related references"
      description: |
        Optional. Include related Issues, Discussions, pull requests,
        project files, examples, specifications, or other useful references.

        Use descriptive link text when possible.
      placeholder: |
        Examples:
        - Related issue: #123
        - Related discussion: ...
        - Relevant project file: ...
    validations:
      required: false

  # ===========================================================================
  # 6️⃣ ANDROID CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🤖 Android context

        Include Android-specific information **only when platform behavior
        affects the documentation issue or correction**.

  - type: textarea
    id: android-context
    attributes:
      label: "🤖 Android-specific context"
      description: |
        Optional. Include relevant Android platform behavior, API levels,
        permissions, lifecycle rules, storage restrictions, background
        execution, notifications, accessibility, form factors, or
        manufacturer-specific behavior.
      placeholder: |
        Examples:
        - Android/API level
        - Runtime permissions
        - Scoped storage behavior
        - Background execution restrictions
        - Notification behavior
        - Activity or process lifecycle behavior
        - TalkBack or accessibility behavior
        - Font scaling or display-size behavior
        - Tablet, foldable, or large-screen behavior
        - Device/manufacturer-specific behavior
    validations:
      required: false

  # ===========================================================================
  # 7️⃣ TECHNICAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🔧 Technical context

        Include implementation-oriented information only when it helps
        **verify or correct the documentation**.

  - type: textarea
    id: technical-context
    attributes:
      label: "🔧 Technical considerations"
      description: |
        Optional. Include relevant APIs, commands, configuration,
        dependencies, compatibility requirements, build behavior,
        integrations, or other technical details.
      placeholder: |
        Examples:
        - Android API or framework behavior
        - Gradle or build configuration
        - Required commands
        - API usage
        - External dependencies
        - Compatibility requirements
        - Configuration requirements
    validations:
      required: false

  # ===========================================================================
  # 8️⃣ SUPPORTING MATERIAL
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🖼️ Supporting material

        Add focused evidence that helps explain or verify the documentation
        problem.

        > [!CAUTION]
        > Review every uploaded file before submitting it.
        > Remove personal, identifying, confidential, or otherwise sensitive
        > information.

  - type: upload
    id: supporting-material
    attributes:
      label: "🖼️ Screenshots / supporting files"
      description: |
        Optional. Attach screenshots, diagrams, recordings, or a PDF when
        they help demonstrate the documentation issue.

        Keep uploads directly relevant to this report.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm,.pdf"

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 Additional context"
      description: |
        Optional. Add examples, edge cases, design notes, historical context,
        related discussions, or anything else useful to understanding or
        correcting the documentation.
      placeholder: |
        Add any additional relevant information here.
    validations:
      required: false

  # ===========================================================================
  # 9️⃣ CONTRIBUTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🤝 Contribution

        Documentation contributions are welcome when they follow the project's
        documentation and contribution standards.

        > [!NOTE]
        > Offering to contribute does not require you to implement the change
        > and does not guarantee that a proposed correction will be accepted
        > without revision.

  - type: checkboxes
    id: contribution
    attributes:
      label: "🤝 Contribution"
      description: "Optional — indicate whether you may be interested in contributing."
      options:
        - label: "I am willing to submit a documentation change if this report is accepted."
          required: false

  # ===========================================================================
  # 🔟 PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 10. 🔐 Privacy & security

        ### 🌐 Remember: this report is public

        Issues and their attachments are normally visible to anyone who
        can access the repository.

        Before submitting, review:

        - 📝 Issue text and quoted documentation
        - 🔗 Links and references
        - 💻 Commands and terminal output
        - 🖼️ Screenshots and diagrams
        - 🎥 Screen recordings
        - 📄 Documents
        - 📎 Other attachments

        > [!IMPORTANT]
        > If this documentation issue reveals or depends on a **security
        > vulnerability**, do not submit it publicly. Follow the private
        > reporting process described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public issue confirmation"
      description: "Confirm that this report is appropriate for public disclosure."
      options:
        - label: "I reviewed this report and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🏁 Ready to submit?

        ### 💡 A strong documentation report answers these questions

        | | Question | Why it matters |
        |:---:|---|---|
        | 📍 | **Where is the problem?** | Locates the affected documentation |
        | 🎯 | **What is wrong or missing?** | Defines the documentation gap |
        | 📖 | **What does it say today?** | Establishes the current state |
        | 🧪 | **How can it be verified?** | Confirms the reported problem |
        | ✨ | **What should it communicate?** | Defines the desired correction |
        | 🔗 | **What sources support it?** | Establishes technical accuracy |
        | ✅ | **How can the improvement be validated?** | Makes completion verifiable |
        | 🔐 | **Can it be discussed safely?** | Protects users and the project |

        > **Precise location → verified problem → authoritative correction → useful documentation.** 🚀

        Thank you for taking the time to help keep the project's
        documentation accurate, accessible, and dependable. 💙
