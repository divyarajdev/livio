name: 📚 Documentation
description: Report missing, incorrect, unclear, or outdated documentation with enough context to verify and improve it.
title: "[Docs]: "
labels:
  - documentation

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## 📚 Documentation

        Thanks for helping improve the project's documentation.

        Please provide enough information for the maintainer to verify
        the issue, understand what needs to change, and determine how
        the improvement can be validated.

        ### Before you submit

        - 🔎 Search existing issues and discussions for related reports.
        - 📖 Check the current documentation before reporting a problem.
        - 🔗 Identify the exact documentation location when possible.
        - 📚 Use authoritative sources when reporting technical inaccuracies.
        - 🔐 Remove passwords, tokens, private keys, and personal information.
        - 🛡️ Do not report security vulnerabilities here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm these items before submitting.
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: I checked the current documentation and confirmed that it needs improvement.
          required: true
        - label: I am reporting a documentation issue, not a bug, feature request, or support question.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # DOCUMENTATION LOCATION & PROBLEM
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🔍 Documentation problem

        Identify exactly where the documentation problem exists
        and explain what is wrong, missing, unclear, or outdated.

  - type: input
    id: documentation-location
    attributes:
      label: Documentation location
      description: |
        Provide the URL, repository file path, section, heading,
        or other precise location of the documentation.
      placeholder: |
        Example:
        docs/setup.md — "Installation" section
        or
        https://example.com/docs/setup
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What is wrong, missing, unclear, inconsistent, or outdated?
        Explain why the current documentation is insufficient.
      placeholder: |
        Example:
        The installation instructions do not explain the required
        Android permissions for a fresh installation.
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: Documentation issue type
      description: What kind of documentation problem is this?
      options:
        - Missing information
        - Incorrect information
        - Outdated information
        - Unclear or confusing information
        - Broken link or reference
        - Typographical or grammatical error
        - Incomplete example
        - Poor organization or discoverability
        - Inconsistent information
        - Other
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # CURRENT CONTENT & VERIFICATION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 🧪 Current content & verification

        Provide enough evidence for the maintainer to verify the
        reported documentation problem.

  - type: textarea
    id: current-content
    attributes:
      label: Current content
      description: |
        Quote or summarize the relevant documentation.
        Keep quotations reasonably short and do not include
        sensitive information.
      placeholder: |
        Example:
        The current documentation states that the application
        requires permission X, but does not mention permission Y.
    validations:
      required: true

  - type: textarea
    id: verification-evidence
    attributes:
      label: Verification / evidence
      description: |
        Explain how the documentation problem can be verified.
        Include observed behavior, official platform information,
        reproducible checks, screenshots, or other supporting evidence
        when applicable.
      placeholder: |
        Examples:
        - The documented command no longer works.
        - The behavior differs on Android 15.
        - The official Android documentation describes different behavior.
        - The linked resource no longer exists.
        - The screenshot no longer matches the current UI.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # EXPECTED DOCUMENTATION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. ✏️ Expected documentation

        Describe what the documentation should communicate
        and how the improvement can be verified.

  - type: textarea
    id: expected-content
    attributes:
      label: Expected content
      description: |
        Describe the information, correction, clarification, or guidance
        that should be provided.
      placeholder: |
        Example:
        The documentation should explain which permissions are required,
        when they are requested, and what happens if they are denied.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        Define observable conditions that should be true when the
        documentation change is considered complete.
        Keep the criteria clear and verifiable.
      placeholder: |
        Example:
        - The required permissions are documented accurately.
        - The instructions match the current Android behavior.
        - Relevant API-level differences are explained when necessary.
        - All referenced links are valid.
        - The documented steps can be followed successfully.
    validations:
      required: true

  - type: textarea
    id: suggested-wording
    attributes:
      label: Suggested wording
      description: |
        Optional. Provide proposed replacement text when you have
        a clear wording suggestion.
      placeholder: |
        Provide suggested documentation text here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # REFERENCES
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 🔗 References & sources

        Provide material that helps verify the documentation
        and determine the correct information.

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Optional. Include related issues, discussions, project files,
        examples, specifications, or other useful references.
      placeholder: |
        Add relevant references here.
    validations:
      required: false

  - type: textarea
    id: authoritative-source
    attributes:
      label: Authoritative source
      description: |
        Optional but strongly recommended for factual or technical
        corrections. Prefer official Android documentation, official
        API documentation, standards, or other authoritative sources.
      placeholder: |
        Example:
        Official Android documentation, API reference, or specification
        supporting the proposed correction.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # VERSION & ANDROID CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🤖 Affected version & Android context

        Provide version and Android information only when it affects
        the documentation issue.

  - type: textarea
    id: affected-version-context
    attributes:
      label: Affected version / context
      description: |
        Optional. Identify the application version, documentation version,
        release, platform version, or other context in which the problem
        occurs.
      placeholder: |
        Examples:
        - App version: 1.4.2
        - Documentation applies to version 1.4.x
        - Issue introduced after a specific release
        - Current documentation only
    validations:
      required: false

  - type: textarea
    id: android-context
    attributes:
      label: Android context
      description: |
        Optional. Include Android-specific information when relevant,
        such as API levels, permissions, lifecycle behavior, storage,
        background execution, notifications, accessibility, device
        behavior, or platform restrictions.
      placeholder: |
        Examples:
        - Android/API level
        - Runtime permissions
        - Scoped storage
        - Background execution
        - Notification behavior
        - Android lifecycle behavior
        - Accessibility behavior
        - Device/manufacturer-specific behavior
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # TECHNICAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🔧 Technical context

        Add technical information only when it is relevant
        to verifying or correcting the documentation.

  - type: textarea
    id: technical-context
    attributes:
      label: Technical considerations
      description: |
        Optional. Include relevant APIs, commands, configuration,
        dependencies, compatibility requirements, build behavior,
        integrations, or other technical details.
      placeholder: |
        Examples:
        - Android API or framework behavior
        - Gradle/build configuration
        - Required commands
        - API usage
        - External dependencies
        - Compatibility requirements
        - Configuration requirements
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include screenshots, examples, related discussions,
        design notes, or anything else that may help verify or improve
        the documentation.
      placeholder: |
        Add any additional information that may be relevant.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONTRIBUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🤝 Contribution

        Documentation improvements are welcome when they follow
        the project's documentation standards.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional.
      options:
        - label: I am willing to submit a documentation change if this issue is accepted.
          required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🔐 Privacy & security

        This issue will normally be public.

        Review all text, links, screenshots, examples, and attachments
        before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      description: Confirm that this report is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this report and its attachments.
          required: true
        - label: This report does not contain a security vulnerability that should be privately disclosed.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful documentation report?

        **Where is the problem? → What is wrong or missing? → How can it be**
        **verified? → What should the documentation say? → What authoritative**
        **source supports the correction? → How can the improvement be validated?**

        Thank you for helping keep the project's documentation accurate,
        understandable, verifiable, and useful.
