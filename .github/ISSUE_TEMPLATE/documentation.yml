name: "📚 Documentation"
description: "Report missing, incorrect, unclear, outdated, incomplete, or broken documentation."
title: "[Docs]: "
labels:
  - "documentation"

body:
  # ===========================================================================
  # 📚 WELCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # 📚 Documentation Report

        Thanks for helping keep the project's documentation **accurate,
        accessible, and useful**! 💙

        Use this form to report documentation that is **missing, incorrect,
        outdated, unclear, incomplete, inconsistent, inaccessible, or broken**.

        A strong documentation report connects four things:

        **📍 Location → 🎯 Problem → 🧪 Evidence → ✨ Correction**

        ---

        ### 🧭 Before you begin

        Please make sure that you:

        - 🔎 **Search existing issues and discussions** for the same problem.
        - 📚 **Check the current documentation** before reporting it.
        - 📍 **Identify the affected page, file, section, topic, or feature.**
        - 🎯 **Explain what is wrong, missing, or difficult to understand.**
        - 🧪 Add **verification or evidence** when the issue is factual or technical.
        - 🏛️ Prefer **authoritative or primary sources** for technical corrections.
        - 🤖 Include **Android-specific context** only when platform behavior matters.
        - 📎 Add screenshots, diagrams, or supporting material when they improve clarity.
        - 🐛 Use **Bug Report** for reproducible application defects.
        - ✨ Use **Feature Request** for new functionality or product improvements.
        - 💬 Use **Q&A / Discussions** for questions, guidance, and troubleshooting.

        > [!WARNING]
        > **Do not publicly disclose security vulnerabilities or sensitive information.**
        > Security-sensitive findings belong in the private reporting process
        > described in `SECURITY.md`. Remove passwords, tokens, API keys,
        > personal information, and other secrets from everything you submit.

  # ===========================================================================
  # ✅ PRE-FLIGHT
  # ===========================================================================

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checklist"
      description: "Confirm that this documentation report is ready for review."
      options:
        - label: "I searched existing issues and discussions and did not find a duplicate."
          required: true

        - label: "I checked the current documentation before submitting this report."
          required: true

        - label: "This is a documentation issue, not a confirmed application bug, feature request, or support question."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true

  # ===========================================================================
  # 1️⃣ LOCATION & TYPE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1️⃣ 📍 Location & type

        **Where is the documentation problem?**

        Give us the most precise location available. If documentation is
        completely missing, identify the feature, workflow, concept, or topic
        that should be documented.

        > [!TIP]
        > A file path, URL, heading, section name, or feature name can make
        > even a small documentation problem much faster to locate.

  - type: input
    id: documentation-location
    attributes:
      label: "📍 Documentation location / topic"
      description: |
        Provide the URL, repository path, page, heading, section, feature,
        topic, or another precise location.

        If documentation does not yet exist, name the subject that should
        be documented.
      placeholder: "Example: docs/setup.md — Installation section"
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: "🧭 Documentation issue type"
      description: "Which category best describes the problem?"
      options:
        - "➕ Missing information"
        - "❌ Incorrect information"
        - "🕰️ Outdated information"
        - "💭 Unclear or confusing information"
        - "🧩 Incomplete information"
        - "🔗 Broken link or reference"
        - "✍️ Typographical or grammatical error"
        - "💻 Incorrect or incomplete example"
        - "🗂️ Poor organization or discoverability"
        - "⚖️ Inconsistent or conflicting information"
        - "♿ Accessibility issue"
        - "📚 Other documentation issue"
    validations:
      required: true

  # ===========================================================================
  # 2️⃣ PROBLEM
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2️⃣ 🎯 Documentation problem

        **What is wrong or missing?**

        Explain the documentation gap from the reader's perspective:
        what might they misunderstand, fail to find, or be unable to
        accomplish successfully?

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem"
      description: |
        Clearly describe the documentation issue and why the current
        information is insufficient.
      placeholder: |
        Example:
        The installation guide describes the storage workflow but does not
        explain that an Android permission may be required, so users can reach
        the workflow without understanding why access is unavailable.
    validations:
      required: true

  - type: textarea
    id: current-content
    attributes:
      label: "📖 Current documentation"
      description: |
        Optional. Briefly summarize what the documentation currently says,
        or quote only the small excerpt needed to identify the problem.

        Keep quotations focused and remove sensitive information.
      placeholder: |
        Example:
        The current section explains how to select a storage location but
        does not mention the associated Android permission.

  # ===========================================================================
  # 3️⃣ VERIFICATION & SCOPE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3️⃣ 🧪 Verification & scope

        **How can the problem be confirmed, and when does it apply?**

        Verification is especially useful for technical instructions,
        commands, examples, platform behavior, screenshots, and version-specific
        documentation.

        Editorial fixes such as spelling or wording usually need little or
        no additional evidence.

  - type: textarea
    id: verification
    attributes:
      label: "🧪 Verification / evidence"
      description: |
        Optional. Explain how the documentation problem can be confirmed.

        Include focused observations, reproducible checks, command output,
        official documentation, or other relevant evidence.
      placeholder: |
        Examples:
        - The documented command no longer produces the described result.
        - The behavior differs on Android 16.
        - The referenced page returns an error.
        - The screenshot no longer matches the current application.
        - Official Android documentation specifies different behavior.

  - type: textarea
    id: affected-context
    attributes:
      label: "🧩 Affected context"
      description: |
        Optional. Identify versions, platforms, configurations, workflows,
        or other conditions under which the documentation problem applies.
      placeholder: |
        Examples:
        - App version: 1.4.2
        - Android 16 (API 36)
        - Fresh installation workflow
        - Current main branch
        - Documentation introduced in version 1.3.0

  # ===========================================================================
  # 4️⃣ DESIRED DOCUMENTATION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4️⃣ ✨ Desired documentation

        **What should the reader understand or be able to accomplish instead?**

        Describe the intended documentation outcome. Exact replacement wording
        is welcome, but it is not required.

  - type: textarea
    id: expected-content
    attributes:
      label: "✨ Expected content"
      description: |
        Describe the correction, clarification, missing information,
        example, or guidance that should be provided.

        Focus on the intended outcome rather than requiring exact wording.
      placeholder: |
        Example:
        The documentation should explain which permission is required,
        when Android requests it, why it is needed, and what behavior
        users should expect when permission is denied.
    validations:
      required: true

  - type: textarea
    id: success-criteria
    attributes:
      label: "✅ Success criteria"
      description: |
        Optional. List observable conditions that would indicate the
        documentation improvement is complete and correct.
      placeholder: |
        Examples:
        - Required permissions are documented accurately.
        - Instructions match current Android behavior.
        - Relevant API-level differences are explained.
        - Referenced links resolve successfully.
        - The documented workflow can be completed as written.
        - Examples match current application behavior.
        - Accessibility considerations are covered where relevant.

  - type: textarea
    id: suggested-wording
    attributes:
      label: "✍️ Suggested wording"
      description: |
        Optional. Provide concise replacement or additional wording when
        you already have a proposed correction.

        Maintainers may adapt it to match project terminology and style.
      placeholder: |
        Add suggested documentation text here.

  # ===========================================================================
  # 5️⃣ SOURCES & TECHNICAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5️⃣ 🏛️ Sources & technical context

        **What establishes the correct behavior?**

        For factual or technical corrections, primary sources help distinguish
        verified behavior from assumptions.

        Useful sources may include:

        | Source | Best used for |
        |:---:|---|
        | 🤖 **Android documentation** | Platform and API behavior |
        | 📘 **Project documentation** | Project-specific behavior |
        | 📐 **Specifications / standards** | Defined external requirements |
        | 💻 **Source / configuration** | Current implementation details |
        | 🔗 **Related issues / PRs** | Historical and project context |

  - type: textarea
    id: authoritative-source
    attributes:
      label: "🏛️ Authoritative source"
      description: |
        Optional for editorial changes; strongly recommended for factual
        or technical corrections.

        Prefer official Android documentation, API references, project
        documentation, standards, specifications, or other primary sources.
      placeholder: |
        Example:
        Official Android documentation describing the relevant platform behavior.

  - type: textarea
    id: references
    attributes:
      label: "🔗 Related references"
      description: |
        Optional. Add related issues, discussions, pull requests, project
        files, specifications, examples, or other useful references.

        Use descriptive link text where practical.
      placeholder: |
        Examples:
        - Related issue: #123
        - Related pull request: #456
        - Relevant project file: ...
        - Platform documentation: ...

  - type: textarea
    id: android-context
    attributes:
      label: "🤖 Android-specific context"
      description: |
        Optional. Include Android details only when platform behavior
        materially affects the documentation or proposed correction.

        Relevant areas include API levels, permissions, lifecycle behavior,
        storage, background execution, notifications, accessibility,
        form factors, and manufacturer-specific behavior.
      placeholder: |
        Examples:
        - Android/API level
        - Runtime permissions
        - Scoped storage behavior
        - Background execution restrictions
        - Notification behavior
        - Activity or process lifecycle behavior
        - TalkBack behavior
        - Font and display scaling
        - Tablet, foldable, or large-screen behavior
        - Manufacturer-specific differences

  - type: textarea
    id: technical-context
    attributes:
      label: "🔧 Other technical context"
      description: |
        Optional. Add implementation-oriented information only when it helps
        verify or correct the documentation.

        This may include APIs, commands, Gradle configuration, dependencies,
        integrations, compatibility requirements, or build behavior.
      placeholder: |
        Examples:
        - Relevant API or framework behavior
        - Gradle/build configuration
        - Required commands
        - External dependencies
        - Compatibility constraints
        - Configuration requirements

  # ===========================================================================
  # 6️⃣ SUPPORTING MATERIAL
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6️⃣ 🖼️ Supporting material

        **Is there visual or additional evidence that makes the problem clearer?**

        Screenshots and other supporting files are most useful when they
        directly demonstrate the documentation gap or outdated behavior.

        > [!CAUTION]
        > Review every uploaded file before submitting it. Remove personal,
        > identifying, confidential, or otherwise sensitive information.

  - type: upload
    id: supporting-material
    attributes:
      label: "🖼️ Screenshots / supporting files"
      description: |
        Optional. Upload screenshots, diagrams, recordings, or a PDF when
        they help explain or verify the documentation issue.

        Keep uploads focused on this report.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm,.pdf"

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 Additional context"
      description: |
        Optional. Add edge cases, design notes, historical context, related
        discussions, or anything else that may help understand or correct
        the documentation.
      placeholder: |
        Add any additional relevant context here.

  # ===========================================================================
  # 7️⃣ CONTRIBUTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 7️⃣ 🤝 Contribution

        Interested in helping improve the documentation?

        Documentation contributions are welcome when they follow the project's
        terminology, structure, accessibility, and contribution standards.

        > [!NOTE]
        > Offering to contribute is not a commitment, and proposed wording may
        > be adapted during review.

  - type: checkboxes
    id: contribution
    attributes:
      label: "🤝 Contribution interest"
      description: "Optional — tell us whether you may be interested in contributing."
      options:
        - label: "I may be willing to submit a documentation change if this report is accepted."
          required: false

  # ===========================================================================
  # 8️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 8️⃣ 🔐 Privacy & security

        ### 🌐 Assume everything submitted here is public

        Before submitting, review **every part of the report**:

        - 📝 Issue text and quoted documentation
        - 🔗 Links and references
        - 💻 Commands and terminal output
        - 🖼️ Screenshots and diagrams
        - 🎥 Screen recordings
        - 📄 Documents
        - 📎 Other uploaded files

        Remove anything that should not be publicly disclosed.

        > [!IMPORTANT]
        > If this documentation problem reveals or depends on a **security
        > vulnerability**, do not submit it publicly. Follow the private
        > reporting process described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public disclosure confirmation"
      description: "Confirm that this report is safe and appropriate for public disclosure."
      options:
        - label: "I reviewed this report and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "This report does not publicly disclose a security vulnerability."
          required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        # 🏁 Ready to submit?

        A strong documentation report creates a clear path from
        **problem** to **correction**:

        | | Question | What it establishes |
        |:---:|---|---|
        | 📍 | **Where is the problem?** | The affected documentation |
        | 🎯 | **What is wrong or missing?** | The documentation gap |
        | 📖 | **What does it say today?** | The current state |
        | 🧪 | **How can it be verified?** | Evidence and scope |
        | ✨ | **What should it communicate?** | The desired outcome |
        | 🏛️ | **What establishes the correct behavior?** | Technical accuracy |
        | ✅ | **What does completion look like?** | Verifiable success |
        | 🔐 | **Is it safe to discuss publicly?** | User and project protection |

        ### 📚 Documentation journey

        **Precise location** → **Clear problem** → **Verified evidence** →
        **Authoritative correction** → **Useful documentation** 🚀

        ---

        ### 💙 Thank you

        Thank you for helping keep the project's documentation accurate,
        understandable, accessible, and dependable for everyone.
