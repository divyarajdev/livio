name: "🐛 Bug Report"
description: "Report a reproducible defect or unexpected behavior"
title: "[Bug]: "
labels:
  - bug
  - needs-triage
type: bug

body:
  # Purpose and routing
  - type: markdown
    attributes:
      value: |
        Use this form for a reproducible defect in the app or project.

        Use the Q&A category for usage, configuration, or troubleshooting questions.
        Use the Feature Request form for proposed behavior changes.

  # Pre-submission checks
  - type: checkboxes
    id: prechecks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing open and closed issues for this defect.
          required: true
        - label: This report covers one defect.
          required: true
        - label: >-
            I am not publicly disclosing a security vulnerability, and I removed
            credentials, authentication tokens, private endpoints, personal data,
            and other sensitive data from this report and its attachments.
          required: true

  # Defect scope
  - type: textarea
    id: description
    attributes:
      label: Defect summary
      description: Describe the affected workflow, scope, and impact. Do not repeat the reproduction steps.
      placeholder: |
        Affected workflow:
        Scope:
        Impact:
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected component or module
      description: Identify the affected screen, feature, API, service, or Gradle module.
      placeholder: "Example: Settings > Backup, authentication, or :core:network"
    validations:
      required: true

  # Reproduction
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: List the smallest known sequence that causes the defect.
      placeholder: |
        1. Start from ...
        2. Open ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Select how consistently the defect occurs when following the reproduction steps.
      options:
        - Every attempt
        - Most attempts
        - Intermittently
        - Observed once
        - Unable to reproduce again
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the result that should occur after completing the reproduction steps.
      placeholder: "After completing the steps, the app should ..."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: State the observed result, including error messages, incorrect state, or missing behavior.
      placeholder: "After completing the steps, the app instead ..."
    validations:
      required: true

  # Regression range
  - type: input
    id: regression-last-good
    attributes:
      label: Last known working version or revision
      description: Provide the most recent app version, release tag, or commit SHA where the behavior worked correctly.
      placeholder: "Example: 2.3.0 or abc1234"

  - type: input
    id: regression-first-bad
    attributes:
      label: First known affected version or revision
      description: Provide the earliest app version, release tag, or commit SHA where the defect occurred.
      placeholder: "Example: 2.4.0 or def5678"

  # App environment
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Provide the exact affected app version. Do not enter "latest" or "current".
      placeholder: "Example: 2.4.1"
    validations:
      required: true

  - type: dropdown
    id: build-channel
    attributes:
      label: Installation or build source
      description: Select how the affected build was obtained.
      options:
        - Google Play
        - F-Droid
        - GitHub Releases
        - Beta or preview build
        - Nightly or CI artifact
        - Locally built from source
        - Preinstalled or managed build
        - Other
    validations:
      required: true

  - type: input
    id: build-number
    attributes:
      label: Build identifier or commit SHA
      description: Provide the versionCode, CI build identifier, release tag, or commit SHA when relevant.
      placeholder: "Example: versionCode 20401, nightly-2026.08.29, or a1b2c3d"

  # Android environment
  - type: input
    id: android-version
    attributes:
      label: Android version and API level
      description: Provide the Android version. Include the API level when available.
      placeholder: "Example: Android 16 / API 36"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device manufacturer and model
      description: Identify the physical device or emulator where the defect occurs.
      placeholder: "Example: Google Pixel 9 Pro or Pixel 8 API 36 emulator"
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: Android distribution or ROM
      description: Provide the Android distribution, manufacturer skin, or custom ROM when relevant.
      placeholder: "Example: Stock Android, One UI, GrapheneOS, or LineageOS"

  # Diagnostic evidence
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostic output
      description: Paste the smallest relevant Logcat excerpt, stack trace, Gradle failure, or diagnostic output that contains the failure.
      placeholder: |
        Paste the relevant diagnostic output here.
      render: text

  - type: upload
    id: media
    attributes:
      label: Screenshots, recordings, or diagnostic files
      description: Upload only evidence that demonstrates or helps diagnose the defect.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm,.log,.txt,.json"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional diagnostic context
      description: Record relevant conditions not captured above, such as update history, network state, background restrictions, account state, or a temporary workaround.
      placeholder: |
        Triggering conditions:
        Recent app or system changes:
        Temporary workaround:
        Related issue:
