name: "🐛 Bug Report"
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels:
  - bug
  - needs-triage
type: bug  

body:
  # Introduction
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        Provide enough information for the problem to be reproduced and investigated.

        > **Security:** Do not report security vulnerabilities in a public issue. Follow the private reporting instructions in the repository's security policy.

        > **Privacy:** Remove passwords, authentication tokens, email addresses, personal data, and other sensitive information from logs, screenshots, recordings, and attachments.

  # Pre-submission
  - type: markdown
    attributes:
      value: |
        ## ✅ Pre-submission

  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      description: Confirm each item before opening the report.
      options:
        - label: I searched open and closed issues and could not find an existing report for this bug.
          required: true
        - label: This report covers one bug only.
          required: true
        - label: I removed private, personal, and security-sensitive information from the report and its attachments.
          required: true

  # Issue details
  - type: markdown
    attributes:
      value: |
        ## 🐛 Issue details

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Describe the problem clearly, including what you were doing when it happened.
      placeholder: Describe what is not working as expected.
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Affected component or feature
      description: Enter the screen, feature, module, or component where the issue occurs.
      placeholder: "Settings / Backup / Authentication"
    validations:
      required: true

  # Reproduction
  - type: markdown
    attributes:
      value: |
        ## 🔁 Reproduction

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the exact steps required to reproduce the issue.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: Select how consistently the issue can be reproduced.
      options:
        - Always
        - Often
        - Sometimes
        - Rarely
        - Unable to reproduce consistently
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the result you expected.
      placeholder: Describe what should happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe the result that actually occurs.
      placeholder: Describe what happens instead.
    validations:
      required: true

  - type: input
    id: regression-last-good
    attributes:
      label: Last known working version
      description: Optional. Enter the most recent app version in which this worked correctly.
      placeholder: "2.3.0"

  - type: input
    id: regression-first-bad
    attributes:
      label: First known affected version
      description: Optional. Enter the earliest app version in which you noticed the problem.
      placeholder: "2.4.0"

  # Environment
  - type: markdown
    attributes:
      value: |
        ## 📱 Environment

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Enter the exact affected app version. Do not enter "latest" or "current."
      placeholder: "2.4.1"
    validations:
      required: true

  - type: dropdown
    id: build-channel
    attributes:
      label: Installation source or build channel
      description: Select how you installed the app. This helps identify packaging and build-specific problems.
      options:
        - Google Play
        - F-Droid
        - GitHub Releases
        - Debug build
        - Self-built from source
        - Other
    validations:
      required: true

  - type: input
    id: build-number
    attributes:
      label: Build number or commit SHA
      description: Optional. Provide this for nightly, CI, beta, debug, or source builds.
      placeholder: "a1b2c3d or nightly-2026.08.29"

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Enter the Android version running on the affected device.
      placeholder: "Android 16"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Enter the device manufacturer and model.
      placeholder: "Google Pixel 9 Pro"
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: Android distribution or ROM
      description: Optional. Enter the Android distribution or custom ROM, if applicable.
      placeholder: "Stock Android / One UI / LineageOS"

  # Diagnostics
  - type: markdown
    attributes:
      value: |
        ## 🧪 Diagnostics

  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostic information
      description: |
        Paste relevant logcat output, stack traces, or diagnostic logs.

        **Before submitting:** Remove passwords, authentication tokens, email addresses, personal data, and other sensitive information. The submitted content will be formatted automatically as a code block.
      render: shell

  - type: upload
    id: media
    attributes:
      label: Screenshots or screen recordings
      description: Optional. Upload screenshots or recordings that demonstrate the issue. Verify that the files do not reveal private or sensitive information.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  # Additional context
  - type: markdown
    attributes:
      value: |
        ## 📎 Additional context

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Add any other technical information that may help reproduce or investigate the issue.
      placeholder: |
        For example:
        - The issue started after an app or system update.
        - The issue occurs only under specific conditions.
        - You found a temporary workaround.
