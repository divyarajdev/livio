name: ✨ Feature Request
description: Propose a new feature or improvement with enough context to evaluate its value, scope, and expected behavior.
title: "[Feature]: "
labels:
  - enhancement

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request

        Thanks for helping improve the project.

        Please provide enough information for the maintainer to understand
        the problem, evaluate its impact, define the desired outcome, and
        determine how the change could be validated.

        ### Before you submit

        - 🔎 Search existing issues and discussions for related requests.
        - 🎯 Focus on the problem and desired outcome rather than implementation.
        - 📊 Provide evidence or explain the expected impact when possible.
        - 🔐 Remove passwords, tokens, private keys, and personal information.
        - 🛡️ Do not report security vulnerabilities here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm these items before submitting.
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: I am proposing a feature or improvement, not a bug report or support question.
          required: true
        - label: I have described the problem or need that this request is intended to address.
          required: true

  # ---------------------------------------------------------------------------
  # PROBLEM
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🎯 Problem

        Describe what is missing, difficult, inefficient, or limiting today.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What problem are you experiencing?
        What is difficult, unavailable, inefficient, or limiting today?
        Explain why the current behavior or workflow is insufficient.
      placeholder: |
        Example:
        Managing a large number of saved items requires opening each item
        individually, which makes the workflow unnecessarily time-consuming.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        Describe the workflow, scenario, or situation in which this problem
        occurs. Explain who is affected and when the need arises.
      placeholder: |
        Example:
        Users managing large collections may need to perform the same
        action on many items during routine organization.
    validations:
      required: true

  - type: textarea
    id: evidence-impact
    attributes:
      label: Evidence / impact
      description: |
        Explain how significant the problem is. Include examples,
        frequency, measurable impact, user feedback, related issues,
        or other evidence when available.
      placeholder: |
        Examples:
        - This affects a frequent workflow.
        - The operation becomes slow or repetitive for large collections.
        - Related requests or user feedback indicate the same need.
        - The current workaround requires several additional steps.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # PROPOSED SOLUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 💡 Proposed solution

        Describe the capability or outcome you would like to see.

        Focus on the user's need rather than prescribing a specific
        implementation.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe what the application should be able to do and what outcome
        would solve the identified problem.
      placeholder: |
        Example:
        Allow users to select multiple items and perform the same action
        on all selected items.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Describe existing features, workarounds, or alternative approaches
        you considered. Explain why they do not fully solve the problem.
      placeholder: |
        Example:
        The current workaround is to process each item individually,
        which is practical for a small number of items but inefficient
        for larger collections.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # USER EXPERIENCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🎨 Expected user experience

        Describe the desired behavior or interaction from the user's
        perspective when relevant.

  - type: textarea
    id: expected-ux
    attributes:
      label: Expected UX
      description: |
        Describe the expected user flow, interaction, feedback, or behavior.
        UI mockups, screenshots, or examples may be attached when useful.
      placeholder: |
        Example:
        1. Select one or more items.
        2. Choose the desired action.
        3. Confirm the action when necessary.
        4. The selected items are updated and the result is clearly shown.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        Define observable conditions that should be true when the feature
        is considered complete. Keep the criteria user-focused and testable.
      placeholder: |
        Example:
        - Users can select multiple items.
        - The selected action applies to all selected items.
        - The existing single-item workflow continues to work.
        - The result is clearly communicated to the user.
        - The feature does not expose private or sensitive data.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # VALUE & SCOPE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 📊 Value & scope

        Provide information that helps evaluate usefulness, priority,
        and potential scope.

  - type: textarea
    id: beneficiaries
    attributes:
      label: Beneficiaries
      description: |
        Identify the users, workflows, or use cases that would benefit
        from this change.
      placeholder: |
        Example:
        Users who frequently manage large collections.
    validations:
      required: false

  - type: dropdown
    id: usage-frequency
    attributes:
      label: Usage frequency
      description: How frequently would this capability be used?
      options:
        - Several times a day
        - Daily
        - Weekly
        - Occasionally
        - Rarely
        - Unsure
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Change scope
      description: Select the closest description of the requested change.
      options:
        - Small improvement
        - New functionality
        - Major UX or workflow change
        - New integration
        - Unsure
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # ANDROID CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🤖 Android context

        Provide Android-specific information when it affects the
        requested feature. Do not provide unrelated device details.

  - type: textarea
    id: android-constraints
    attributes:
      label: Android constraints
      description: |
        Optional. Describe Android-specific requirements, platform
        behavior, API-level considerations, permissions, lifecycle
        behavior, storage restrictions, background execution limits,
        compatibility requirements, or device-specific limitations.
      placeholder: |
        Examples:
        - Minimum or target Android API level
        - Runtime permissions
        - Scoped storage
        - Background execution restrictions
        - Android lifecycle behavior
        - Notification behavior
        - Accessibility requirements
        - Device or manufacturer-specific limitations
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # TECHNICAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🔧 Technical context

        Add technical information only when it is relevant to evaluating
        the request.

  - type: textarea
    id: technical-context
    attributes:
      label: Technical considerations
      description: |
        Optional. Include known dependencies, compatibility requirements,
        performance considerations, architectural constraints, APIs,
        integrations, or other technical information that may affect
        implementation.
      placeholder: |
        Examples:
        - Required Android APIs
        - External dependencies
        - Existing application components
        - Backward compatibility
        - Performance considerations
        - Network or storage requirements
        - Integration requirements
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include related issues, discussions, examples,
        screenshots, mockups, design notes, or other relevant information.
      placeholder: |
        Add any additional information that may help evaluate the request.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONTRIBUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🤝 Contribution

        Contributions are welcome when the proposed change is accepted
        and follows the project's development standards.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional.
      options:
        - label: I am willing to work on this feature if it is accepted.
          required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🔐 Privacy & security

        This issue will normally be public.

        Review all text, screenshots, mockups, links, examples, and
        attachments before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      description: Confirm that this request is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this report and its attachments.
          required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful feature request?

        **What is the problem? → Who and what is affected? → What evidence**
        **supports the need? → What outcome is wanted? → How should it work?**
        **→ How can success be verified? → What Android or technical constraints**
        **matter?**

        Thank you for clearly explaining the problem, value, desired outcome,
        and conditions that will help determine whether the feature is useful
        and achievable.
