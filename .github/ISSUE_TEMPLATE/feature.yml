name: ✨ Feature Request
description: Propose a new feature or improvement.
title: "[Feature]: "
labels:
  - enhancement

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request

        Thanks for helping improve the project.

        Please provide enough information for a maintainer to understand
        the problem, evaluate the need, and determine the best approach.

        ### Before you submit

        - 🔎 Search existing issues and discussions for related requests.
        - 💡 Keep the request focused on the problem and desired outcome.
        - 🔐 Remove passwords, tokens, private keys, and personal information.
        - 🛡️ Do not report security vulnerabilities here.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm all items before submitting.
      options:
        - label: I searched existing issues and discussions and did not find a duplicate.
          required: true
        - label: I am proposing a feature or improvement, not a bug report or support question.
          required: true

  # ---------------------------------------------------------------------------
  # PROBLEM
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🎯 Problem

        Describe what is missing, difficult, inefficient, or limiting today,
        and explain its impact.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        What is difficult, unavailable, inefficient, or limiting today?
        Explain how it affects your workflow or experience.
      placeholder: |
        What problem are you experiencing?
        What is difficult, unavailable, or inefficient today?
        How does it affect your workflow?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Describe the workflow, scenario, or users affected.
      placeholder: |
        When does this problem occur?
        Who is affected?
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # PROPOSED SOLUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 💡 Proposed solution

        Describe the capability or outcome you would like to see.

        Focus on the user's need rather than prescribing a specific
        implementation.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe the desired capability or behavior from the user's
        perspective. Focus on the outcome rather than implementation
        details. Maintainers will determine the most appropriate approach.
      placeholder: |
        What should the application be able to do?
        What outcome would solve the problem?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe existing features, workarounds, or alternative approaches.
      placeholder: |
        What do you currently use instead?
        Why does it not fully solve the problem?
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # USER EXPERIENCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🎨 User experience

        Describe the desired user flow or interaction when relevant.

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe the expected user flow or interaction.
      placeholder: |
        Describe how the feature should work from the user's perspective.
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: Examples / references
      description: Add relevant links, screenshots, mockups, or examples.
      placeholder: |
        Add references or visual examples here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # VALUE & SCOPE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 📊 Value & scope

        Provide information that may help maintainers evaluate the
        usefulness, impact, and scope of the proposed change.

  - type: textarea
    id: beneficiaries
    attributes:
      label: Who benefits?
      description: Identify the users or workflows that would benefit.
      placeholder: |
        Example:
        Users managing large collections.
    validations:
      required: false

  - type: dropdown
    id: usage-frequency
    attributes:
      label: Usage frequency
      description: How frequently would this feature be used?
      options:
        - Several times a day
        - Daily
        - Weekly
        - Occasionally
        - Rarely
        - Unsure
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Change scope
      description: Select the closest description of the requested change.
      options:
        - Small improvement
        - New functionality
        - Major UX or workflow change
        - New integration
        - Unsure
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # TECHNICAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🔧 Technical context

        Add technical information only when relevant.

  - type: textarea
    id: technical-context
    attributes:
      label: Technical considerations
      description: |
        Describe known compatibility requirements, constraints,
        dependencies, permissions, or performance considerations.
      placeholder: |
        Examples:
        - Android/API requirements
        - Required permissions
        - Backward compatibility
        - External dependencies
        - Performance considerations
        - Device/platform limitations
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include relevant configuration, related issues,
        discussions, design notes, or anything else that may help
        with evaluation.
      placeholder: |
        Add any additional information that may be relevant.
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Screenshots / mockups
      description: Attach visual references when useful.
      placeholder: |
        Drag and drop screenshots, mockups, diagrams, or other files here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONTRIBUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🤝 Contribution

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional.
      options:
        - label: I am willing to work on this feature if it is accepted.
          required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🔐 Privacy & security

        This issue will normally be public.

        Review all text, logs, screenshots, recordings, and attachments
        before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      description: Confirm that this request is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this report and its attachments.
          required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful feature request?

        **What is the problem? → Who is affected? → What outcome is wanted →**
        **Why is it useful? → What constraints matter? → Can we evaluate it**
        **clearly?**

        Thank you for clearly explaining the problem, need, and desired outcome.
