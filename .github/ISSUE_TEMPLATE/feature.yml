name: ✨ Feature Request
description: Propose a new feature or improvement with enough context to evaluate its value, scope, behavior, and feasibility.
title: "[Feature]: "
labels:
  - enhancement

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## ✨ Feature Request

        Use this form to propose a new feature, capability, or improvement.

        Please provide enough information to understand the problem,
        evaluate the value and scope of the request, define the desired
        outcome, and determine how the change can be validated.

        ### Before you submit

        - 🔎 Search existing Issues and Discussions for related requests.
        - 📚 Check the current documentation and existing features first.
        - 🎯 Describe the problem or need rather than prescribing an implementation.
        - 📊 Explain the expected value, impact, or frequency when possible.
        - 🎨 Describe the expected user experience and observable behavior.
        - 📱 Include Android-specific details when they affect the request.
        - 🔧 Include technical constraints only when relevant.
        - 📎 Attach screenshots, mockups, examples, or other evidence when useful.
        - 🔐 Remove passwords, tokens, private keys, personal information,
          and other sensitive data.
        - 🛡️ Do not publicly disclose security vulnerabilities.
        - 🐛 Use the Bug Report for confirmed reproducible application defects.
        - 💬 Use Q&A for questions, guidance, or troubleshooting.
        - 📚 Use the Documentation report for missing, incorrect, unclear,
          or outdated documentation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm these items before submitting.
      options:
        - label: I searched existing Issues and Discussions and did not find a duplicate.
          required: true
        - label: I checked the current documentation and existing features before submitting.
          required: true
        - label: I clearly described the problem or need this request is intended to address.
          required: true
        - label: I described the desired outcome rather than requiring a specific implementation.
          required: true
        - label: This is a feature request or improvement, not a confirmed bug, documentation issue, or Q&A question.
          required: true
        - label: This request does not publicly disclose a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # PROBLEM
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🎯 Problem

        Describe what is missing, difficult, inefficient, or limiting today.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: |
        Explain the problem clearly.

        Describe what is currently difficult, unavailable, inefficient,
        or limiting and why the existing behavior or workflow is insufficient.
      placeholder: |
        Example:
        Managing a large number of saved items requires opening each item
        individually, which makes the workflow unnecessarily time-consuming.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        Describe the workflow, scenario, or situation in which the
        problem occurs.

        Explain who is affected, when the need arises, and what
        the user is trying to accomplish.
      placeholder: |
        Example:
        Users managing large collections may need to perform the same
        action on many items during routine organization.
    validations:
      required: true

  - type: textarea
    id: evidence-impact
    attributes:
      label: Evidence / impact
      description: |
        Explain how significant the problem is.

        Include examples, frequency, measurable impact, user feedback,
        related requests, existing limitations, or other evidence when available.
      placeholder: |
        Examples:
        - This affects a frequent workflow.
        - The operation becomes slow or repetitive for large collections.
        - Related requests or user feedback indicate the same need.
        - The current workaround requires several additional steps.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # PROPOSED SOLUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 💡 Proposed solution

        Describe the capability or outcome you would like to see.

        Focus on the user need and desired result rather than
        prescribing a specific implementation.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe what the application should be able to do,
        what the user should be able to accomplish, and how
        the proposed change would address the identified problem.
      placeholder: |
        Example:
        Allow users to select multiple items and perform the same
        action on all selected items.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Describe existing features, workarounds, or alternative
        approaches you considered.

        Explain why they do not fully solve the identified problem.
      placeholder: |
        Example:
        The current workaround is to process each item individually,
        which is practical for a small number of items but inefficient
        for larger collections.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # EXPECTED USER EXPERIENCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🎨 Expected user experience

        Describe the desired behavior or interaction from the
        user's perspective.

  - type: textarea
    id: expected-ux
    attributes:
      label: Expected UX
      description: |
        Describe the expected user flow, interaction, feedback,
        states, or behavior when the feature is used.

        Include UI mockups, screenshots, diagrams, or examples
        when they help communicate the intended experience.
      placeholder: |
        Example:
        1. Select one or more items.
        2. Choose the desired action.
        3. Confirm the action when necessary.
        4. The selected items are updated.
        5. The result is clearly communicated to the user.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: |
        Define observable conditions that should be true when
        the feature is considered complete.

        Keep each criterion clear, specific, user-focused, and testable.
      placeholder: |
        Example:
        - Users can select multiple items.
        - The selected action applies to all selected items.
        - The existing single-item workflow continues to work.
        - Invalid or unsupported selections are handled clearly.
        - The result is clearly communicated to the user.
        - The feature does not expose private or sensitive data.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # VALUE & SCOPE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 📊 Value & scope

        Provide information that helps evaluate usefulness,
        priority, impact, and potential scope.

  - type: textarea
    id: beneficiaries
    attributes:
      label: Beneficiaries
      description: |
        Identify the users, workflows, or use cases that would
        benefit from this change.
      placeholder: |
        Example:
        Users who frequently manage large collections.
    validations:
      required: true

  - type: dropdown
    id: usage-frequency
    attributes:
      label: Usage frequency
      description: How frequently would this capability be used?
      options:
        - Several times a day
        - Daily
        - Weekly
        - Occasionally
        - Rarely
        - Unsure
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Change scope
      description: Select the closest description of the requested change.
      options:
        - Small improvement
        - New functionality
        - Major UX or workflow change
        - New integration
        - Unsure
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # ANDROID CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🤖 Android context

        Provide Android-specific information only when it affects
        the requested feature.

  - type: textarea
    id: android-constraints
    attributes:
      label: Android constraints
      description: |
        Optional. Describe Android-specific requirements or constraints,
        including API-level behavior, permissions, lifecycle behavior,
        storage restrictions, background execution limits, notifications,
        accessibility requirements, compatibility requirements, or
        device/manufacturer-specific limitations.
      placeholder: |
        Examples:
        - Minimum or target Android API level
        - Runtime permissions
        - Scoped storage
        - Background execution restrictions
        - Notification behavior
        - Android lifecycle behavior
        - Accessibility requirements
        - Device or manufacturer-specific limitations
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # TECHNICAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🔧 Technical context

        Add technical information only when it is relevant
        to evaluating the request.

  - type: textarea
    id: technical-context
    attributes:
      label: Technical considerations
      description: |
        Optional. Include known dependencies, compatibility requirements,
        performance considerations, architectural constraints, APIs,
        integrations, storage, network requirements, or other technical
        information that may affect feasibility.
      placeholder: |
        Examples:
        - Required Android APIs
        - External dependencies
        - Existing application components
        - Backward compatibility
        - Performance considerations
        - Network or storage requirements
        - Integration requirements
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # REFERENCES & ADDITIONAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🔗 References & additional context

        Provide supporting material that helps evaluate the request.

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Optional. Include related Issues, Discussions, documentation,
        examples, specifications, external references, or other
        relevant material.
      placeholder: |
        Add relevant references here.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include screenshots, mockups, diagrams, examples,
        design notes, research, or other information that may help
        evaluate the request.
      placeholder: |
        Add any additional relevant information here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONTRIBUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🤝 Contribution

        Contributions are welcome when the proposed change is accepted
        and follows the project's development standards.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional.
      options:
        - label: I am willing to work on this feature if it is accepted.
          required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🔐 Privacy & security

        Issues are normally public.

        Review all text, links, screenshots, mockups, examples,
        and attachments before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      description: Confirm that this request is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this request and its attachments.
          required: true
        - label: I am not publicly disclosing a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful feature request?

        **What is the problem? → Who and what is affected? → What evidence**
        **supports the need? → What outcome is wanted? → How should it**
        **work for the user? → How can success be verified? → What Android**
        **or technical constraints matter?**

        Thank you for providing clear, relevant, and verifiable information
        that helps evaluate the usefulness, scope, feasibility, and expected
        behavior of the proposed change.
