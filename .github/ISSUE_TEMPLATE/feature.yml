name: "✨ Feature Request"
description: "Propose a new feature or improvement with enough context to evaluate its value, scope, behavior, and feasibility."
title: "[Feature]: "
labels:
  - "enhancement"

body:
  # ===========================================================================
  # ✨ INTRODUCTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # ✨ Feature Request

        Thanks for helping improve the project! 💙

        Use this form to propose a **new feature, capability, or meaningful
        improvement**.

        A useful feature request starts with the **problem or user need**,
        then describes the desired outcome and enough context to evaluate
        its value, scope, behavior, and feasibility.

        ### 🧭 Before you submit

        Please make sure that you:

        - 🔎 **Search existing Issues and Discussions** for related requests.
        - 📚 **Check the current documentation and existing features** first.
        - 🎯 **Describe the problem or need** before prescribing an implementation.
        - 📊 **Explain the expected value, impact, or frequency** when possible.
        - 🎨 **Describe the expected user experience** when behavior or UI matters.
        - 🤖 **Include Android-specific details** only when they affect the request.
        - 🔧 **Include technical constraints** only when relevant to evaluation.
        - 📎 **Attach screenshots, mockups, diagrams, or examples** when useful.
        - 🐛 Use the **Bug Report** for reproducible application defects.
        - 💬 Use **Q&A** for questions, guidance, or troubleshooting.
        - 📖 Use the **Documentation Report** for incorrect, unclear, missing,
          or outdated documentation.

        > [!TIP]
        > ### 💡 Start with the problem
        >
        > Feature requests are easier to evaluate when they explain
        > **what is difficult today, who is affected, and why it matters**
        > before proposing how the application should change.

        > [!WARNING]
        > ### 🔐 Security vulnerabilities
        >
        > **Do not disclose security vulnerabilities in a public issue.**
        > Follow the private disclosure process described in `SECURITY.md`.

        > [!IMPORTANT]
        > ### 🛡️ Protect sensitive information
        >
        > Issues and attachments are normally **publicly visible**.
        > Remove passwords, authentication tokens, API keys, private keys,
        > personal information, account details, and other sensitive data
        > before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checks"
      description: "Confirm that this request is ready for evaluation."
      options:
        - label: "I searched existing Issues and Discussions and did not find a duplicate."
          required: true

        - label: "This is a feature request or improvement, not a confirmed bug, documentation issue, or support question."
          required: true

        - label: "This request does not publicly disclose a security vulnerability."
          required: true

  # ===========================================================================
  # 1️⃣ PROBLEM
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🎯 Problem

        Help us understand **what is missing, difficult, inefficient,
        inaccessible, confusing, or limiting today**.

        Focus on the underlying need before describing a solution.

  - type: dropdown
    id: request-type
    attributes:
      label: "🧭 Request type"
      description: "Which category best describes this request?"
      options:
        - "New capability"
        - "Improvement to an existing feature"
        - "User experience improvement"
        - "Accessibility improvement"
        - "Performance or efficiency improvement"
        - "Compatibility or integration improvement"
        - "Other improvement"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem"
      description: |
        Clearly describe the problem or limitation.

        Explain what is currently difficult, unavailable, inefficient,
        inaccessible, confusing, or otherwise insufficient.
      placeholder: |
        Example:
        Managing a large number of saved items requires opening each item
        individually, making routine organization unnecessarily repetitive
        and time-consuming.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: "🧩 Use case"
      description: |
        Describe the workflow or situation in which this need arises.

        Explain who is affected, when the need occurs, and what the user
        is trying to accomplish.
      placeholder: |
        Example:
        Users managing large collections may need to perform the same
        action on many items during routine organization.
    validations:
      required: true

  - type: textarea
    id: evidence-impact
    attributes:
      label: "📊 Evidence / impact"
      description: |
        Help us understand how significant the problem is.

        Include frequency, measurable impact, user feedback, related requests,
        workflow costs, current limitations, or other evidence when available.
      placeholder: |
        Examples:
        - This affects a workflow used several times each day.
        - The current process requires several additional actions per item.
        - The limitation becomes significant with large collections.
        - Related requests or feedback describe the same need.
    validations:
      required: false

  # ===========================================================================
  # 2️⃣ DESIRED OUTCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 💡 Desired outcome

        Describe **what should become possible** if this request is addressed.

        Focus on the user-visible capability or result rather than requiring
        a particular internal implementation.

  - type: textarea
    id: desired-outcome
    attributes:
      label: "✨ Desired outcome"
      description: |
        Describe what the application should enable the user to accomplish
        and how that outcome would address the problem above.
      placeholder: |
        Example:
        Allow users to select multiple items and apply the same supported
        action to the entire selection.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔀 Alternatives considered"
      description: |
        Describe existing features, workarounds, or alternative approaches
        you considered.

        Explain why they do not fully address the identified problem.
      placeholder: |
        Example:
        The current workaround is to process each item individually.
        This works for small collections but becomes inefficient when
        many items require the same action.
    validations:
      required: false

  # ===========================================================================
  # 3️⃣ EXPECTED USER EXPERIENCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🎨 Expected user experience

        Describe **how the feature should behave from the user's perspective**.

        Consider the normal workflow and any important loading, empty,
        unavailable, confirmation, success, and error states when relevant.

  - type: textarea
    id: expected-ux
    attributes:
      label: "🎨 Expected UX"
      description: |
        Describe the expected user flow, interaction, feedback, states,
        navigation, or observable behavior.

        Screenshots, mockups, diagrams, and examples are welcome when
        they make the intended experience easier to understand.
      placeholder: |
        Example:
        1. Select one or more items.
        2. Choose an available action.
        3. Confirm the operation when necessary.
        4. Apply the action to the selected items.
        5. Clearly communicate success, partial failure, or failure.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Acceptance criteria"
      description: |
        Define observable conditions that would indicate the feature
        has been implemented successfully.

        Keep each criterion clear, specific, user-focused, and testable.
      placeholder: |
        Example:
        - Users can select multiple compatible items.
        - Supported actions apply to the entire selection.
        - Unsupported selections are handled clearly.
        - Existing single-item behavior continues to work.
        - Success and failure states are communicated clearly.
        - Accessibility behavior remains usable.
        - Private or sensitive information is not exposed.
    validations:
      required: false

  # ===========================================================================
  # 4️⃣ VALUE & REACH
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 📈 Value & reach

        Help us understand **who benefits and how often the capability
        would be useful**.

        Frequency is useful context for prioritization, but it is not the
        only measure of value.

  - type: textarea
    id: beneficiaries
    attributes:
      label: "👥 Beneficiaries"
      description: |
        Identify the users, workflows, scenarios, or use cases that would
        benefit from this change.
      placeholder: |
        Example:
        Users who frequently organize or maintain large collections.
    validations:
      required: false

  - type: dropdown
    id: usage-frequency
    attributes:
      label: "⏱️ Expected usage frequency"
      description: "How frequently would you expect to use this capability?"
      options:
        - "Several times a day"
        - "Daily"
        - "Weekly"
        - "Occasionally"
        - "Rarely"
        - "Unsure"
    validations:
      required: false

  # ===========================================================================
  # 5️⃣ ANDROID CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🤖 Android context

        Include Android-specific information **only when it materially
        affects the requested behavior or feasibility**.

  - type: textarea
    id: android-constraints
    attributes:
      label: "🤖 Android requirements / constraints"
      description: |
        Optional. Describe relevant Android platform requirements,
        behaviors, or constraints.

        Useful examples include API-level differences, permissions,
        lifecycle behavior, storage restrictions, background execution,
        notifications, system integrations, accessibility, form factors,
        or manufacturer-specific behavior.
      placeholder: |
        Examples:
        - Minimum or target Android API requirements
        - Runtime permissions
        - Scoped storage behavior
        - Background execution restrictions
        - Notification behavior
        - Activity or process lifecycle behavior
        - TalkBack or accessibility requirements
        - Font scaling or display-size considerations
        - Tablet, foldable, or large-screen behavior
        - Device or manufacturer-specific limitations
    validations:
      required: false

  # ===========================================================================
  # 6️⃣ TECHNICAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🔧 Technical context

        Add implementation-oriented information only when it helps evaluate
        **feasibility, compatibility, risk, performance, or scope**.

        > [!NOTE]
        > Technical suggestions are useful context, but they do not need to
        > prescribe the final architecture or implementation.

  - type: textarea
    id: technical-context
    attributes:
      label: "🔧 Technical considerations"
      description: |
        Optional. Include relevant dependencies, APIs, integrations,
        compatibility requirements, architectural constraints, performance
        considerations, storage behavior, networking, or migration concerns.
      placeholder: |
        Examples:
        - Relevant Android or platform APIs
        - Existing application components
        - External dependencies or integrations
        - Backward compatibility requirements
        - Data or schema migration considerations
        - Performance or memory implications
        - Network or storage requirements
    validations:
      required: false

  # ===========================================================================
  # 7️⃣ REFERENCES & SUPPORTING MATERIAL
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🔗 References & supporting material

        Provide anything that helps communicate, demonstrate, or substantiate
        the request.

        Useful material may include related Issues or Discussions, Android
        documentation, specifications, screenshots, mockups, diagrams,
        research, or comparable interaction patterns.

  - type: textarea
    id: references
    attributes:
      label: "🔗 References"
      description: |
        Optional. Include related Issues, Discussions, documentation,
        specifications, examples, or other relevant references.

        Use descriptive link text where possible so references remain
        understandable and accessible.
      placeholder: |
        Examples:
        - Related issue: #123
        - Relevant Android documentation: ...
        - Related discussion: ...
    validations:
      required: false

  - type: upload
    id: supporting-visuals
    attributes:
      label: "🖼️ Mockups / screenshots / supporting visuals"
      description: |
        Optionally attach screenshots, mockups, diagrams, recordings,
        or a PDF that helps explain the proposed experience.

        Review every file for personal, identifying, or sensitive information
        before uploading it.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm,.pdf"

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 Additional context"
      description: |
        Optional. Add research, design notes, edge cases, assumptions,
        constraints, or anything else that may help evaluate the request.
      placeholder: |
        Add any additional relevant context here.
    validations:
      required: false

  # ===========================================================================
  # 8️⃣ CONTRIBUTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🤝 Contribution

        Contributions are welcome when a proposed change is accepted and
        follows the project's architecture, testing, accessibility, privacy,
        security, and contribution requirements.

        > [!NOTE]
        > Offering to implement a request does not guarantee that the proposal
        > will be accepted in its current form.

  - type: checkboxes
    id: contribution
    attributes:
      label: "🤝 Contribution"
      description: "Optional — indicate whether you may be interested in contributing."
      options:
        - label: "I am willing to work on this feature if the proposal is accepted."
          required: false

  # ===========================================================================
  # 9️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🔐 Privacy & security

        ### 🌐 Remember: this request is public

        Issues and their attachments are normally visible to anyone who
        can access the repository.

        Before submitting, review:

        - 📝 Issue text
        - 🔗 Links and references
        - 🖼️ Screenshots and mockups
        - 🎥 Screen recordings
        - 📄 Documents
        - 📎 Other attachments

        > [!IMPORTANT]
        > If this request reveals or depends on a **security vulnerability**,
        > do not submit it publicly. Follow the private reporting process
        > described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public issue confirmation"
      description: "Confirm that this request is appropriate for public disclosure."
      options:
        - label: "I reviewed this request and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🏁 Ready to submit?

        ### 💡 A strong feature request answers these questions

        | | Question | Why it matters |
        |:---:|---|---|
        | 🎯 | **What problem exists today?** | Establishes the underlying need |
        | 🧩 | **Who or what is affected?** | Defines the relevant use case |
        | 📊 | **What evidence supports it?** | Helps evaluate impact |
        | ✨ | **What outcome is wanted?** | Defines the intended capability |
        | 🎨 | **How should it behave?** | Clarifies the user experience |
        | ✅ | **How can success be verified?** | Makes completion testable |
        | 🤖 | **What Android constraints matter?** | Identifies platform requirements |
        | 🔧 | **What technical factors matter?** | Helps assess feasibility |
        | 🔐 | **Can it be discussed safely?** | Protects users and the project |

        > **Clear problem → useful outcome → defined behavior → testable success.** 🚀

        Thank you for taking the time to provide a thoughtful,
        well-scoped, and actionable feature request. 💙
