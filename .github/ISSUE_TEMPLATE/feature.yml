name: "✨ Feature Request"
description: "Propose a new capability or meaningful improvement."
title: "[Feature]: "
labels:
  - "enhancement"

body:
  # ===========================================================================
  # ✨ WELCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # ✨ Feature Request

        Thanks for helping shape the future of the project! 💙

        Use this form to propose a **new capability or meaningful improvement**
        to the application.

        The strongest proposals begin with the **problem or user need**, then
        describe the desired outcome and enough context to understand its
        value, behavior, scope, and feasibility.

        **🎯 Problem → 🧩 Use case → ✨ Outcome → 🎨 Experience → ✅ Success**

        ---

        ### 🧭 Before you begin

        Please make sure that you:

        - 🔎 **Search existing issues and discussions** for related proposals.
        - 📚 **Check existing features and documentation** first.
        - 🎯 **Explain the problem or need** before prescribing an implementation.
        - 📊 **Describe impact or frequency** when it helps explain the value.
        - 🎨 **Describe the expected experience** when behavior or UI matters.
        - 🤖 Include **Android-specific constraints** only when they affect the request.
        - 🔧 Include **technical considerations** only when useful for evaluation.
        - 📎 Add mockups, screenshots, diagrams, examples, or references when helpful.
        - 🐛 Use **Bug Report** for reproducible application defects.
        - 💬 Use **Q&A / Discussions** for questions, guidance, and troubleshooting.
        - 📖 Use **Documentation Report** for documentation problems.

        > [!WARNING]
        > **Do not publicly disclose security vulnerabilities or sensitive information.**
        > Security-sensitive findings belong in the private reporting process
        > described in `SECURITY.md`. Remove passwords, tokens, API keys,
        > personal information, and other secrets from everything you submit.

  # ===========================================================================
  # ✅ PRE-FLIGHT
  # ===========================================================================

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checklist"
      description: "Confirm that this proposal is ready for evaluation."
      options:
        - label: "I searched existing issues and discussions and did not find a duplicate."
          required: true

        - label: "This is a feature or improvement proposal, not a confirmed bug, documentation problem, or support question."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true

  # ===========================================================================
  # 1️⃣ PROBLEM & USE CASE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1️⃣ 🎯 Problem & use case

        **What is difficult, missing, inefficient, inaccessible, or limiting today?**

        Start with the underlying need. A clear problem statement helps separate
        the **goal** from any particular implementation idea.

        > [!TIP]
        > Describe what the user is trying to accomplish and what prevents them
        > from doing it effectively today.

  - type: dropdown
    id: request-type
    attributes:
      label: "🧭 Request type"
      description: "Which category best describes this proposal?"
      options:
        - "✨ New capability"
        - "🛠️ Improvement to an existing feature"
        - "🎨 User experience improvement"
        - "♿ Accessibility improvement"
        - "⚡ Performance or efficiency improvement"
        - "🔗 Compatibility or integration improvement"
        - "🧩 Other improvement"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem"
      description: |
        Explain the limitation or unmet need.

        Describe what is currently difficult, unavailable, inefficient,
        inaccessible, confusing, or otherwise insufficient.
      placeholder: |
        Example:
        Managing a large collection requires opening every item individually,
        making routine organization repetitive and time-consuming.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: "🧩 Use case"
      description: |
        Describe the workflow in which this need appears.

        Explain who encounters it, when it occurs, and what they are trying
        to accomplish.
      placeholder: |
        Example:
        A user maintaining a large collection may regularly need to perform
        the same operation on many related items.
    validations:
      required: true

  - type: textarea
    id: evidence-impact
    attributes:
      label: "📊 Impact / evidence"
      description: |
        Optional. Help us understand the significance of the problem.

        Useful context includes frequency, workflow cost, measurable impact,
        related feedback, existing requests, or scale.
      placeholder: |
        Examples:
        - This workflow is used several times each day.
        - The current process requires multiple extra actions per item.
        - The limitation becomes significant with larger collections.
        - Related feedback describes the same problem.

  # ===========================================================================
  # 2️⃣ DESIRED OUTCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2️⃣ ✨ Desired outcome

        **What should become possible?**

        Describe the capability from the user's perspective rather than
        requiring a particular internal implementation.

  - type: textarea
    id: desired-outcome
    attributes:
      label: "✨ Desired outcome"
      description: |
        Describe what the application should enable and how that outcome
        would address the problem above.
      placeholder: |
        Example:
        Allow users to select multiple compatible items and apply one
        supported action to the entire selection.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "🔀 Alternatives / workarounds"
      description: |
        Optional. Describe existing features, workarounds, or alternative
        approaches you considered.

        Explain where they fall short.
      placeholder: |
        Example:
        Processing each item individually works for small collections but
        becomes inefficient when many items require the same action.

  # ===========================================================================
  # 3️⃣ EXPERIENCE & SUCCESS
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3️⃣ 🎨 Experience & success

        **How should this feel to use, and how would we know it works?**

        When relevant, consider the normal workflow as well as loading,
        empty, unavailable, confirmation, success, partial-success, and
        error states.

  - type: textarea
    id: expected-ux
    attributes:
      label: "🎨 Expected user experience"
      description: |
        Optional. Describe the expected flow, interactions, feedback,
        navigation, or observable behavior.

        Focus on user-visible behavior rather than implementation details.
      placeholder: |
        Example:
        1. Select one or more compatible items.
        2. Choose an available action.
        3. Confirm the operation when necessary.
        4. Apply it to the selected items.
        5. Clearly communicate success or failure.

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Success criteria"
      description: |
        Optional. List observable, testable outcomes that would indicate
        that the proposal has been implemented successfully.
      placeholder: |
        Examples:
        - Users can select multiple compatible items.
        - Supported actions operate on the full selection.
        - Unsupported states are explained clearly.
        - Existing single-item behavior continues to work.
        - Success and failure states are communicated clearly.
        - Accessibility remains usable.
        - Sensitive information is not exposed.

  # ===========================================================================
  # 4️⃣ VALUE & REACH
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4️⃣ 📈 Value & reach

        **Who benefits, and how often would this matter?**

        Usage frequency can help with prioritization, but frequency alone
        does not determine whether a proposal is valuable.

  - type: textarea
    id: beneficiaries
    attributes:
      label: "👥 Who benefits?"
      description: |
        Optional. Identify the users, workflows, scenarios, or environments
        that would benefit from this change.
      placeholder: |
        Example:
        Users who frequently organize or maintain large collections.

  - type: dropdown
    id: usage-frequency
    attributes:
      label: "⏱️ Expected usage frequency"
      description: "How frequently would you personally expect to use this capability?"
      options:
        - "🔁 Several times a day"
        - "📅 Daily"
        - "🗓️ Weekly"
        - "🕒 Occasionally"
        - "🌙 Rarely"
        - "❓ Unsure"

  # ===========================================================================
  # 5️⃣ PLATFORM & TECHNICAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5️⃣ 🤖 Platform & technical context

        **Are there constraints that materially affect the proposal?**

        Android or implementation details are useful when they help explain
        feasibility, compatibility, risk, performance, accessibility, or scope.

        They are **context**, not a requirement to prescribe the final design.

  - type: textarea
    id: android-constraints
    attributes:
      label: "🤖 Android requirements / constraints"
      description: |
        Optional. Include Android-specific details that materially affect
        the requested behavior.

        Relevant examples include API levels, permissions, lifecycle behavior,
        storage restrictions, background execution, notifications, system
        integrations, accessibility, form factors, or manufacturer behavior.
      placeholder: |
        Examples:
        - Runtime permission requirements
        - Scoped storage behavior
        - Background execution restrictions
        - Notification behavior
        - Activity or process lifecycle considerations
        - TalkBack requirements
        - Font or display scaling
        - Tablet, foldable, or large-screen behavior
        - Manufacturer-specific limitations

  - type: textarea
    id: technical-context
    attributes:
      label: "🔧 Technical considerations"
      description: |
        Optional. Add implementation-oriented information only when it helps
        evaluate feasibility or scope.

        Possible areas include APIs, dependencies, integrations, architecture,
        compatibility, migrations, storage, networking, memory, or performance.
      placeholder: |
        Examples:
        - Relevant Android or platform APIs
        - Existing application components
        - External integrations
        - Backward compatibility requirements
        - Data or schema migration implications
        - Performance or memory considerations
        - Network or storage requirements

  # ===========================================================================
  # 6️⃣ REFERENCES & SUPPORTING MATERIAL
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6️⃣ 🔗 References & supporting material

        **Show us anything that makes the proposal easier to understand.**

        Helpful material can include related issues, discussions, platform
        documentation, specifications, research, mockups, diagrams,
        screenshots, or comparable interaction patterns.

  - type: textarea
    id: references
    attributes:
      label: "🔗 References"
      description: |
        Optional. Add related issues, discussions, documentation,
        specifications, research, or other useful references.

        Prefer descriptive link text where practical.
      placeholder: |
        Examples:
        - Related issue: #123
        - Related discussion: ...
        - Relevant Android documentation: ...
        - Comparable interaction pattern: ...

  - type: upload
    id: supporting-visuals
    attributes:
      label: "🖼️ Mockups / screenshots / supporting files"
      description: |
        Optionally upload screenshots, mockups, diagrams, recordings, or
        documents that help explain the proposal.

        Review every file for personal, identifying, confidential, or
        sensitive information before uploading it.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm,.pdf"

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 Additional context"
      description: |
        Optional. Add edge cases, assumptions, research, design notes,
        constraints, or anything else that may help evaluate this proposal.
      placeholder: |
        Add any additional relevant context here.

  # ===========================================================================
  # 7️⃣ CONTRIBUTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 7️⃣ 🤝 Contribution

        Interested in helping implement the idea?

        Contributions are welcome after a proposal is accepted and aligned
        with the project's architecture, testing, accessibility, privacy,
        security, and contribution requirements.

        > [!NOTE]
        > Offering to implement a feature does not guarantee that the proposal
        > will be accepted in its current form.

  - type: checkboxes
    id: contribution
    attributes:
      label: "🤝 Contribution interest"
      description: "Optional — tell us whether you may be interested in contributing."
      options:
        - label: "I may be willing to work on this feature if the proposal is accepted."
          required: false

  # ===========================================================================
  # 8️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 8️⃣ 🔐 Privacy & security

        ### 🌐 Assume everything submitted here is public

        Before submitting, review **every part of the proposal**:

        - 📝 Issue text
        - 🔗 Links and references
        - 🖼️ Screenshots and mockups
        - 🎥 Screen recordings
        - 📄 Documents
        - 📎 Other uploaded files

        Remove anything that should not be publicly disclosed.

        > [!IMPORTANT]
        > If this proposal reveals or depends on a **security vulnerability**,
        > do not submit it publicly. Follow the private reporting process
        > described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public disclosure confirmation"
      description: "Confirm that this proposal is safe and appropriate for public disclosure."
      options:
        - label: "I reviewed this proposal and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "This proposal does not publicly disclose a security vulnerability."
          required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        # 🏁 Ready to submit?

        A strong feature proposal gives maintainers a clear path from
        **need** to **decision**:

        | | Question | What it establishes |
        |:---:|---|---|
        | 🎯 | **What problem exists today?** | The underlying need |
        | 🧩 | **When does it matter?** | The real-world use case |
        | 📊 | **How significant is it?** | Impact and prioritization context |
        | ✨ | **What should become possible?** | The desired capability |
        | 🎨 | **How should it behave?** | The expected experience |
        | ✅ | **What does success look like?** | Testable completion |
        | 🤖 | **What platform constraints matter?** | Android-specific considerations |
        | 🔧 | **What technical factors matter?** | Feasibility and scope |
        | 🔐 | **Is it safe to discuss publicly?** | User and project protection |

        ### ✨ Proposal journey

        **Clear problem** → **Valuable outcome** → **Defined experience** →
        **Testable success** → **Informed decision** 🚀

        ---

        ### 💙 Thank you

        Thank you for taking the time to submit a thoughtful and well-scoped
        proposal. Clear ideas and useful context help make better product
        decisions for everyone.
