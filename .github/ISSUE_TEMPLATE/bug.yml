name: "Android Bug Report"
description: "Report incorrect or unexpected behavior in the Android application."
title: "[Bug]: "
labels:
  - "bug"

body:
  # ===========================================================================
  # BEFORE YOU BEGIN
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ## 🐛 Before you begin

        > [!WARNING]
        > Do not publicly disclose security vulnerabilities or sensitive information.
        > If the problem may be security-sensitive, use the private disclosure process
        > described in `SECURITY.md`. Remove passwords, authentication tokens, API keys,
        > private keys, personal information, and other secrets from everything you submit.

  - type: checkboxes
    id: preflight
    attributes:
      label: "Pre-submission checklist"
      description: "Confirm that this report belongs in the public bug tracker."
      options:
        - label: "I searched existing issues and did not find the same problem."
          required: true
        - label: "I am reporting an Android application defect, not a feature request, documentation issue, or support question."
          required: true
        - label: "This report covers one distinct problem."
          required: true

  # ===========================================================================
  # PROBLEM
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🔍 Problem

  - type: textarea
    id: description
    attributes:
      label: "Problem summary"
      description: "Summarize the problem in one or two sentences."
      placeholder: |
        Settings crashes after restoring an existing backup.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      description: |
        List the smallest ordered sequence that reproduces the problem.
        If reproduction is unreliable, list the sequence that occurred when you encountered it and state that you cannot reproduce it consistently.
      placeholder: |
        1. Open the application.
        2. Open Settings.
        3. Select Backup & Restore.
        4. Restore an existing backup.
        5. Return to Settings.
        6. Observe the crash.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      description: "State what the application should have done."
      placeholder: |
        The Settings screen should open normally after the restore completes.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      description: "State what happened instead, including any visible error message."
      placeholder: |
        The application closes immediately and returns to the launcher.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "Reproducibility"
      description: "Select how consistently the problem occurs."
      options:
        - "Every time"
        - "Most of the time"
        - "Occasionally"
        - "Happened once"
        - "No longer reproducible"
    validations:
      required: true

  # ===========================================================================
  # ENVIRONMENT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 📱 Environment

  - type: input
    id: app-version
    attributes:
      label: "Application version and build"
      description: "Provide the exact affected application version and build number."
      placeholder: "1.4.2 (142)"
    validations:
      required: true

  - type: dropdown
    id: installation-source
    attributes:
      label: "Installation source"
      description: "Select where you obtained the affected build."
      options:
        - "Google Play"
        - "F-Droid"
        - "GitHub Releases"
        - "Local build"
        - "Other source"
        - "Unknown"
    validations:
      required: true

  - type: input
    id: other-installation-source
    attributes:
      label: "Other installation source"
      description: "If you selected Other source above, provide the exact source or distribution method."
      placeholder: "Obtainium"

  - type: input
    id: build-identifier
    attributes:
      label: "Development build identifier"
      description: "For a development, nightly, preview, or local build, provide the exact commit SHA, branch, or tag."
      placeholder: "8f3c21a"

  - type: input
    id: device
    attributes:
      label: "Device"
      description: "Provide the device manufacturer and model, or the emulator profile."
      placeholder: "Google Pixel 9"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: "Android version"
      description: "Provide the Android version and API level."
      placeholder: "Android 16 (API 36)"
    validations:
      required: true

  - type: input
    id: manufacturer-rom
    attributes:
      label: "ROM or manufacturer software"
      description: "Provide the ROM, manufacturer skin, firmware, or system software version. Enter `Stock Android` when no separate manufacturer skin or custom ROM is installed."
      placeholder: "One UI 8"
    validations:
      required: true

  # ===========================================================================
  # REGRESSION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🔄 Regression

  - type: dropdown
    id: regression
    attributes:
      label: "Regression status"
      description: "Select whether the same behavior worked correctly in an earlier application version."
      options:
        - "Unknown"
        - "No — it has never worked correctly"
        - "Yes — it worked previously"
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: "Last known working version"
      description: "If this is a regression, provide the newest version you know worked correctly and check the changelog or release notes when narrowing the affected version range."
      placeholder: "1.3.0"

  # ===========================================================================
  # DIAGNOSTICS
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🧪 Diagnostics

  - type: textarea
    id: logs
    attributes:
      label: "Logs or stack trace"
      description: "Paste the smallest relevant Logcat excerpt, crash information, exception message, or stack trace."
      placeholder: |
        08-29 12:14:07.331 E/MyApp: Backup restore failed
        java.lang.IllegalStateException: Settings state unavailable
      render: text

  - type: upload
    id: visual-evidence
    attributes:
      label: "Screenshots or screen recording"
      description: "Upload screenshots or a short screen recording that shows the problem."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: upload
    id: diagnostic-files
    attributes:
      label: "Diagnostic file attachments"
      description: "Upload complete log files, structured diagnostic data, or a diagnostic archive directly relevant to the problem."
    validations:
      required: false
      accept: ".log,.txt,.json,.csv,.zip,.gz"

  # ===========================================================================
  # ADDITIONAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🧠 Additional context

  - type: textarea
    id: workaround
    attributes:
      label: "Workaround"
      description: "Describe any action that temporarily avoids, reduces, or resolves the problem."
      placeholder: |
        Restarting the application temporarily resolves the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Provide relevant configuration, recent changes, related issues, unusual circumstances, or other details that help isolate the problem."
      placeholder: |
        The problem started after updating from 1.3.0 to 1.4.2.
        It occurs only when automatic backup is enabled.
        Related issue: #123

  # ===========================================================================
  # PRIVACY AND SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🔐 Privacy and security

  - type: checkboxes
    id: privacy
    attributes:
      label: "Public disclosure confirmation"
      description: "Confirm that the complete report is appropriate for public disclosure."
      options:
        - label: "I reviewed all body text, logs and stack traces, screenshots, screen recordings, attached diagnostic files, and linked resources in this report and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true
        - label: "This report does not describe a security vulnerability that requires private disclosure through the process in SECURITY.md."
          required: true
