name: 🐛 Bug Report
description: Report a reproducible problem to help us investigate and fix it.
title: "[Bug]: "
labels:
  - bug

body:
  # ---------------------------------------------------------------------------
  # REPORTING GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thank you for helping improve the project.

        > **Please provide enough information for a maintainer to reproduce the
        > problem without having to ask for the basic details again.**

        ### Before submitting

        - 🔎 Search existing issues for duplicates.
        - 🔄 Test the latest supported version when possible.
        - 🧪 Confirm that the problem is reproducible.
        - 🔐 Remove passwords, tokens, private keys, and personal information.
        - 🛡️ For security vulnerabilities, use the project's security policy
          instead of this public issue form.

  - type: checkboxes
    id: preflight
    attributes:
      label: ✅ Pre-submission checks
      description: Confirm each item before submitting this report.
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am reporting a bug, not a feature request or support question.
          required: true
        - label: I tested the latest available version, or I cannot update for a valid reason.
          required: true

  # ---------------------------------------------------------------------------
  # PROBLEM
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---
        ## 1. 🔍 Problem

        Start with the problem itself. Keep the description focused on
        observable behavior rather than assumptions about the cause.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: |
        Describe the problem and what you were doing when it occurred.

        Include relevant context such as the affected screen, feature,
        action, or operation.
      placeholder: |
        Example:
        The application closes unexpectedly when I open the settings screen
        after restoring an existing backup.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Provide the smallest reliable sequence of steps that reproduces
        the problem.

        If the issue requires specific data or configuration, mention it here.
      placeholder: |
        1. Open the application.
        2. Open Settings.
        3. Select Backup & Restore.
        4. Restore an existing backup.
        5. Return to Settings.
        6. Observe the application crash.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: |
        The settings screen should open normally after the restore completes.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: |
        The application closes immediately and returns to the launcher.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How consistently can you reproduce the problem?
      options:
        - Every time
        - Most of the time
        - Occasionally
        - Happened once
        - No longer reproducible
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # ENVIRONMENT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---
        ## 2. 📱 Environment

        Please provide the exact environment where the problem occurs.
        This is especially important for Android-specific issues.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Enter the exact version affected by the problem.
      placeholder: "Example: 1.4.2 (142)"
    validations:
      required: true

  - type: dropdown
    id: installation-source
    attributes:
      label: Installation source
      description: Where was the application installed from?
      options:
        - Google Play
        - F-Droid
        - GitHub Releases
        - Other official distribution
        - Local build
        - Unknown
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Provide the manufacturer and model. For an emulator, provide the device profile.
      placeholder: "Example: Google Pixel 9"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Provide the Android version and API level if known.
      placeholder: "Example: Android 16 (API 36)"
    validations:
      required: true

  - type: input
    id: manufacturer-rom
    attributes:
      label: ROM / manufacturer software
      description: |
        Optional. Provide the ROM, firmware, or manufacturer software
        when relevant to the problem.
      placeholder: "Example: One UI 8 / GrapheneOS / LineageOS"
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # REGRESSION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---
        ## 3. 🔄 Regression

        Knowing whether the problem is new helps maintainers identify
        potentially affected changes and versions.

  - type: dropdown
    id: regression
    attributes:
      label: Did this work previously?
      description: Determine whether this behavior is a regression.
      options:
        - Unknown
        - No, it never worked correctly
        - Yes, it worked in an earlier version
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last known working version
      description: |
        Optional. If this is a regression, provide the latest version
        where the behavior worked correctly.
      placeholder: "Example: 1.3.0"
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # DIAGNOSTICS
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---
        ## 4. 🧪 Diagnostics

        These details are optional but can significantly reduce
        investigation time.

        > **Never include secrets or sensitive personal information.**

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: |
        Optional. Include relevant Logcat output, crash information,
        exception messages, or a stack trace.

        Remove sensitive information before submitting.
      placeholder: |
        Paste relevant diagnostic output here.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recording
      description: |
        Optional. Attach visual evidence when it helps demonstrate
        the problem.
      placeholder: |
        Drag and drop screenshots or a screen recording here.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: |
        Optional. Describe anything that temporarily avoids,
        reduces, or resolves the problem.
      placeholder: |
        Example:
        Restarting the application temporarily resolves the issue.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # ADDITIONAL INFORMATION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---
        ## 5. 📝 Additional information

        Add anything else that could help a maintainer understand,
        reproduce, or diagnose the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include relevant configuration, recent changes,
        related issues, unusual circumstances, or other useful details.
      placeholder: |
        Add any additional information that may be relevant.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---
        ## 6. 🔐 Privacy & security

        This issue will normally be public. Review all text,
        logs, screenshots, and attachments before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      description: Confirm that this report is safe to disclose publicly.
      options:
        - label: I removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this report and its attachments.
          required: true
        - label: This report does not contain a security vulnerability that should be privately disclosed.
          required: true

  # ---------------------------------------------------------------------------
  # MAINTAINER NOTE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 Maintainer note

        A high-quality bug report normally answers:

        **What happened? → How can we reproduce it? → What should happen? →  
        What actually happened? → Which environment is affected? → Can we
        investigate it safely?**

        Thank you for providing clear and reproducible information.
