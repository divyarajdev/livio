name: "Android Bug Report"
description: "Report incorrect or unexpected behavior in the Android application."
title: "[Bug]: "

# Keep this key only after confirming that the label exists.
labels:
  - "bug"

body:
  # Before you begin
  - type: markdown
    attributes:
      value: |
        ## Before you begin

        > [!WARNING]
        > Do not publicly disclose security vulnerabilities or sensitive information.
        > If the problem may be security-sensitive, follow the private disclosure
        > process documented in `SECURITY.md`. Remove passwords, authentication
        > tokens, API keys, private keys, personal information, device identifiers,
        > and other secrets from everything you submit.

  - type: checkboxes
    id: preflight
    attributes:
      label: "Pre-submission checklist"
      description: "Confirm that this report belongs in the public bug tracker."
      options:
        - label: "I searched existing issues and did not find the same problem."
          required: true
        - label: "I am reporting an Android application defect, not a feature request, documentation issue, or support question."
          required: true
        - label: "This report covers one distinct problem."
          required: true

  # Problem
  - type: markdown
    attributes:
      value: |
        ## Problem

  - type: textarea
    id: problem-summary
    attributes:
      label: "Problem summary"
      description: "Summarize the problem in one or two sentences."
      placeholder: "Settings crashes after restoring an existing backup."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: "Steps to reproduce"
      description: "List the smallest ordered sequence that reproduces the problem. If reproduction is unreliable, list the sequence that occurred when you encountered it and state that you cannot reproduce it consistently."
      placeholder: |
        1. Open the application.
        2. Open Settings.
        3. Select Backup & Restore.
        4. Restore an existing backup.
        5. Return to Settings.
        6. Observe the crash.
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected behavior"
      description: "State what the application should have done."
      placeholder: "The Settings screen should open normally after the restore completes."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual behavior"
      description: "State what happened instead, including the exact visible error message."
      placeholder: "The application closes immediately and returns to the launcher."
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "Reproducibility"
      description: "Select how consistently the problem occurs."
      options:
        - "Every time"
        - "Most of the time"
        - "Occasionally"
        - "Happened once"
        - "No longer reproducible"
    validations:
      required: true

  # Environment
  - type: markdown
    attributes:
      value: |
        ## Environment

  - type: input
    id: application-version
    attributes:
      label: "Application version and build"
      description: "Provide the exact affected version name and build identifier shown by the application or distribution channel."
      placeholder: "Example: 1.4.2 (build 142)"
    validations:
      required: true

  - type: input
    id: installation-source
    attributes:
      label: "Installation source"
      description: "State the exact store, release channel, download source, or local build method used to install the affected build."
      placeholder: "Example: Google Play production, GitHub release v1.4.2, or local build"
    validations:
      required: true

  - type: input
    id: development-build
    attributes:
      label: "Development build identifier"
      description: "For a local, nightly, preview, or development build, provide the full commit SHA and the selected build variant or release channel."
      placeholder: "Example: 8f3c21ab4570d12e33cd3d7f6a5c9b7e1d2468aa; debug"

  - type: input
    id: device
    attributes:
      label: "Device or emulator"
      description: "Provide the device manufacturer and model, or the complete emulator profile."
      placeholder: "Example: Google Pixel 9 or Pixel 9 API 37 emulator"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: "Android version and API level"
      description: "Provide the Android release and API level installed on the affected device."
      placeholder: "Example: Android 17 (API 37)"
    validations:
      required: true

  - type: input
    id: system-software
    attributes:
      label: "System image or vendor software"
      description: "Provide the vendor skin and version, custom ROM and version, emulator system image, or system build identifier."
      placeholder: "Example: One UI 8, LineageOS 23, or Google APIs x86_64 API 37"
    validations:
      required: true

  # Regression
  - type: markdown
    attributes:
      value: |
        ## Regression

  - type: dropdown
    id: regression-status
    attributes:
      label: "Regression status"
      description: "Select whether the same workflow worked correctly in an earlier application version."
      options:
        - "Unknown"
        - "No — it has never worked correctly"
        - "Yes — it worked previously"
    validations:
      required: true

  - type: input
    id: last-known-working-version
    attributes:
      label: "Last known working version"
      description: "For a confirmed or possible regression, provide the newest version known to work. Check the changelog or release notes when narrowing the affected version range."
      placeholder: "Example: 1.3.0 (build 130)"

  # Diagnostics
  - type: markdown
    attributes:
      value: |
        ## Diagnostics

  - type: textarea
    id: logs
    attributes:
      label: "Logs or stack trace"
      description: "Paste the smallest sanitized Logcat excerpt, crash record, exception message, or stack trace that demonstrates the failure."
      placeholder: |
        08-29 12:14:07.331 E/MyApp: Backup restore failed
        java.lang.IllegalStateException: Settings state unavailable
      render: "shell"

  - type: upload
    id: visual-evidence
    attributes:
      label: "Screenshots or screen recording"
      description: "Upload sanitized screenshots or a short screen recording that shows the problem."
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: upload
    id: diagnostic-files
    attributes:
      label: "Diagnostic file attachments"
      description: "Upload sanitized log files, structured diagnostic data, or diagnostic archives directly relevant to the problem."
    validations:
      required: false
      accept: ".log,.txt,.json,.csv,.zip,.gz"

  # Additional context
  - type: markdown
    attributes:
      value: |
        ## Additional context

  - type: textarea
    id: workaround
    attributes:
      label: "Workaround"
      description: "Describe any action that temporarily avoids, reduces, or resolves the problem."
      placeholder: "Restarting the application temporarily resolves the problem."

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional context"
      description: "Provide relevant configuration, recent changes, related issues, or unusual circumstances that help isolate the problem."
      placeholder: |
        The problem started after updating from 1.3.0 to 1.4.2.
        It occurs only when automatic backup is enabled.
        Related issue: #123

  # Privacy and security
  - type: markdown
    attributes:
      value: |
        ## Privacy and security

  - type: checkboxes
    id: public-disclosure-confirmation
    attributes:
      label: "Public disclosure confirmation"
      description: "Confirm that the complete report is appropriate for public disclosure."
      options:
        - label: "I reviewed all report text, logs and stack traces, screenshots, screen recordings, attached diagnostic files, and linked resources and removed passwords, authentication tokens, API keys, private keys, personal information, device identifiers, and other sensitive data."
          required: true
        - label: "This report does not describe a security vulnerability that requires the private disclosure process documented in SECURITY.md."
          required: true
