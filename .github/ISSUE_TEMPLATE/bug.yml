name: "🐛 Bug Report"
description: "Report a reproducible problem with the application."
title: "[Bug]: "
labels:
  - "bug"

body:
  # ===========================================================================
  # 🐛 WELCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # 🐛 Bug Report

        Thanks for helping make the project better! 💙

        Use this form to report a **reproducible problem with the application**.
        The more focused and complete the report is, the easier it is to
        reproduce, diagnose, and fix.

        **🔎 Search → 🔁 Reproduce → 📱 Describe → 🧪 Diagnose → 🛡️ Sanitize → 🚀 Submit**

        ---

        ### 🧭 Before you begin

        Please make sure that you:

        - 🔎 **Search existing issues** for the same problem.
        - 🆕 **Test the latest supported version** when reasonably possible.
        - 🎯 **Report one distinct problem per issue.**
        - 🔁 **Provide the reproduction information** currently available to you.
        - 💡 Use **Feature Request** for proposed functionality or improvements.
        - 💬 Use **Q&A / Discussions** for questions, guidance, or general troubleshooting.
        - 📚 Use **Documentation Report** for incorrect, unclear, missing, or outdated documentation.

        > [!WARNING]
        > **Do not publicly disclose security vulnerabilities or sensitive information.**
        > If the problem may be security-sensitive, follow the private disclosure
        > process in `SECURITY.md`. Remove passwords, tokens, API keys, personal
        > information, and other secrets from everything you submit.

  # ===========================================================================
  # ✅ PRE-FLIGHT
  # ===========================================================================

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checklist"
      description: "Confirm that this report is ready for investigation."
      options:
        - label: "I searched existing issues and did not find a duplicate."
          required: true

        - label: "I am reporting a bug rather than a feature request, documentation issue, or support question."
          required: true

        - label: "I checked the latest supported version when reasonably possible."
          required: true

        - label: "I included the reproduction information currently available to me."
          required: true

        - label: "This report focuses on one distinct problem."
          required: true

  # ===========================================================================
  # 1️⃣ PROBLEM
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1️⃣ 🔍 Problem

        **What went wrong?**

        Start with the smallest, clearest description of the failure and the
        shortest reliable path that makes it happen.

        > [!TIP]
        > A small, repeatable reproduction is usually more valuable than a long
        > narrative. Include only the steps needed to expose the problem.

  - type: textarea
    id: description
    attributes:
      label: "📝 Problem description"
      description: |
        Clearly explain the problem and what you were doing when it occurred.
      placeholder: |
        Example:
        The application crashes when opening Settings after restoring
        an existing backup.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "🔁 Steps to reproduce"
      description: |
        Provide the smallest reliable sequence that reproduces the problem.

        If the problem cannot currently be reproduced, describe the sequence
        that occurred when you encountered it.
      placeholder: |
        Example:
        1. Open the application.
        2. Open Settings.
        3. Select Backup & Restore.
        4. Restore an existing backup.
        5. Return to Settings.
        6. Observe the crash.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "✅ Expected behavior"
      description: |
        Describe what you expected the application to do.
      placeholder: |
        Example:
        The Settings screen should open normally after the restore completes.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "❌ Actual behavior"
      description: |
        Describe what happened instead.

        Include visible error messages when relevant.
      placeholder: |
        Example:
        The application closes immediately and returns to the launcher.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: "🎯 Reproducibility"
      description: "How consistently does the problem occur?"
      options:
        - "🔴 Every time"
        - "🟠 Most of the time"
        - "🟡 Occasionally"
        - "⚪ Happened once"
        - "🔵 No longer reproducible"
    validations:
      required: true

  # ===========================================================================
  # 2️⃣ ENVIRONMENT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2️⃣ 📱 Environment

        **Where does the problem happen?**

        Exact application and Android environment information helps distinguish
        application defects from device-, ROM-, OS-, build-, or
        distribution-specific behavior.

  - type: input
    id: app-version
    attributes:
      label: "📦 App version"
      description: |
        Provide the exact affected application version, including the build
        number when available.
      placeholder: "Example: 1.4.2 (142)"
    validations:
      required: true

  - type: input
    id: build-identifier
    attributes:
      label: "🔨 Build / commit"
      description: |
        For development, nightly, preview, or local builds, provide the commit
        SHA, branch, tag, or another useful build identifier.
      placeholder: "Example: 8f3c21a / main / v1.4.2"

  - type: dropdown
    id: installation-source
    attributes:
      label: "📥 Installation source"
      description: "Where was the affected build obtained?"
      options:
        - "🛍️ Google Play"
        - "🤖 F-Droid"
        - "🐙 GitHub Releases"
        - "🛠️ Local build"
        - "📦 Other source"
        - "❓ Unknown"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: "📲 Device"
      description: |
        Provide the device manufacturer and model.

        For an emulator, provide the emulator or virtual device profile.
      placeholder: "Example: Google Pixel 9"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: "🤖 Android version"
      description: |
        Provide the Android version and API level when known.
      placeholder: "Example: Android 16 (API 36)"
    validations:
      required: true

  - type: input
    id: manufacturer-rom
    attributes:
      label: "🧩 ROM / manufacturer software"
      description: |
        Provide the ROM, firmware, manufacturer skin, or system software
        version when relevant.
      placeholder: "Example: One UI 8 / GrapheneOS / LineageOS"

  # ===========================================================================
  # 3️⃣ REGRESSION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3️⃣ 🔄 Regression

        **Did this work correctly before?**

        Knowing the last working version can dramatically reduce the number of
        changes that need investigation.

  - type: dropdown
    id: regression
    attributes:
      label: "⏪ Did this work previously?"
      description: |
        Indicate whether the affected behavior worked correctly in an earlier
        application version.
      options:
        - "❓ Unknown"
        - "🆕 No — it has never worked correctly"
        - "✅ Yes — it worked previously"
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: "✅ Last known working version"
      description: |
        If this appears to be a regression, provide the newest version you know
        worked correctly.
      placeholder: "Example: 1.3.0"

  # ===========================================================================
  # 4️⃣ DIAGNOSTICS
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4️⃣ 🧪 Diagnostics

        **Help us see what the application saw.**

        Focused diagnostics can substantially reduce investigation time.

        Useful evidence may include:

        | Evidence | Useful for |
        |:---:|---|
        | 📋 **Logcat / logs** | Runtime failures and warnings |
        | 💥 **Stack traces** | Exception and crash locations |
        | 🖼️ **Screenshots** | Visual or layout defects |
        | 🎥 **Recordings** | Timing and interaction problems |
        | 📎 **Diagnostic files** | Structured debugging information |

        > [!CAUTION]
        > **Sanitize every diagnostic before uploading it.**
        > Review logs, screenshots, recordings, stack traces, and files for
        > passwords, tokens, API keys, account data, personal information,
        > identifiers, private paths, and other sensitive content.

  - type: textarea
    id: logs
    attributes:
      label: "📋 Logs / stack trace"
      description: |
        Include only the Logcat output, crash information, exception messages,
        or stack trace relevant to this problem.

        Remove unrelated output and sensitive information before submitting.
      placeholder: |
        Paste the smallest relevant diagnostic excerpt here.
      render: text

  - type: upload
    id: visual-evidence
    attributes:
      label: "🖼️ Screenshots / screen recording"
      description: |
        Upload screenshots or a short screen recording when visual evidence
        helps demonstrate the problem.

        Review every file for sensitive or identifying information first.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4,.mov,.webm"

  - type: upload
    id: diagnostic-files
    attributes:
      label: "📎 Additional diagnostic files"
      description: |
        Optionally upload sanitized logs, structured diagnostic data, or an
        archive containing information directly relevant to this bug.

        Avoid full device dumps and unrelated files.
    validations:
      required: false
      accept: ".log,.txt,.json,.csv,.zip,.gz"

  - type: textarea
    id: workaround
    attributes:
      label: "🩹 Workaround"
      description: |
        Describe anything that temporarily avoids, reduces, or resolves
        the problem.
      placeholder: |
        Example:
        Restarting the application temporarily resolves the issue.

  # ===========================================================================
  # 5️⃣ ADDITIONAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5️⃣ 🧠 Additional context

        **What else could help narrow this down?**

        Include context only when it contributes to reproducing, explaining,
        or isolating the problem.

  - type: textarea
    id: additional-context
    attributes:
      label: "💬 Additional context"
      description: |
        Include relevant configuration, recent changes, related issues,
        unusual circumstances, or other investigation context.
      placeholder: |
        Examples:
        - The issue started immediately after updating the application.
        - It occurs only when a particular setting is enabled.
        - It occurs only on one device or ROM.
        - A related issue or pull request may provide useful context.

  # ===========================================================================
  # 6️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6️⃣ 🔐 Privacy & security

        ### 🌐 Assume everything submitted here is public

        Before submitting, review **every part of the report**:

        - 📝 Issue text
        - 📋 Logs and stack traces
        - 🖼️ Screenshots
        - 🎥 Screen recordings
        - 📎 Uploaded files
        - 🔗 Linked resources

        Remove anything that should not be publicly disclosed.

        > [!IMPORTANT]
        > If this problem may represent a **security vulnerability**, do not
        > continue with a public bug report. Follow the private reporting
        > process described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public disclosure confirmation"
      description: |
        Confirm that this report is safe and appropriate for public disclosure.
      options:
        - label: "I reviewed the report and all attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "This report does not describe a security vulnerability that requires private disclosure."
          required: true

  # ===========================================================================
  # 🏁 FINAL CHECK
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        # 🏁 Ready to submit?

        A useful bug report gives maintainers a clear investigation path:

        | | Question | Why it matters |
        |:---:|---|---|
        | 🔍 | **What happened?** | Defines the problem |
        | 🔁 | **How do we reproduce it?** | Creates a reliable test case |
        | ✅ | **What should happen?** | Defines intended behavior |
        | ❌ | **What happens instead?** | Identifies the failure |
        | 📱 | **Where does it happen?** | Defines the affected environment |
        | 🧪 | **What evidence exists?** | Accelerates diagnosis |
        | 🔐 | **Is it safe to share?** | Protects users and contributors |

        ### ✨ Investigation flow

        **Clear report** → **Reliable reproduction** → **Focused diagnosis** → **Verified fix** 🚀

        ---

        ### 💙 Thank you

        Thank you for taking the time to submit a thoughtful and actionable
        report. High-quality reports make the project better for everyone.
