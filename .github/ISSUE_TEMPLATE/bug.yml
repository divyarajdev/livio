name: 🐛 Bug Report
description: Report a reproducible or observable problem with the application.
title: "[Bug]: "
labels:
  - bug
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Report

        Thanks for helping improve the project.

        Please provide enough information for a maintainer to reproduce,
        investigate, and understand the problem.

        ### Before you report

        - 🔎 Search existing Issues for duplicates.
        - 🔄 Test the latest supported version when possible.
        - 🧪 Try to reproduce the problem and describe the result.
        - 🔐 Remove passwords, tokens, private keys, personal information,
          and other sensitive data.
        - 🛡️ Do not report security vulnerabilities here.
        - ✨ Use the Feature Request for new functionality or improvements.
        - 💬 Use Q&A for questions, guidance, or troubleshooting.
        - 📚 Use the Documentation report for documentation problems.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm these items before submitting.
      options:
        - label: I searched existing Issues and did not find a duplicate.
          required: true
        - label: I am reporting a bug, not a feature request or support question.
          required: true
        - label: I tested the latest supported version, or I cannot update for a valid reason.
          required: true
        - label: I attempted to reproduce the problem and described the result below.
          required: true
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🔍 Problem

        Describe what happened and provide clear reproduction steps.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        What went wrong? Describe the problem and what you were doing
        when it occurred.
      placeholder: |
        Example:
        The application crashes when opening Settings after restoring
        an existing backup.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: |
        Provide the smallest reliable sequence of steps that reproduces
        the problem. If it is intermittent, describe what you tried.
      placeholder: |
        1. Open the application.
        2. Open Settings.
        3. Select Backup & Restore.
        4. Restore an existing backup.
        5. Return to Settings.
        6. Observe the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: |
        The Settings screen should open normally.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include any visible error message.
      placeholder: |
        The application closes immediately and returns to the launcher.
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Reproducibility
      description: How consistently can you reproduce the problem?
      options:
        - Every time
        - Most of the time
        - Occasionally
        - Happened once
        - No longer reproducible
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 📱 Environment

        Provide the application and Android environment where the
        problem occurs.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Provide the exact version affected by the problem.
      placeholder: "Example: 1.4.2 (142)"
    validations:
      required: true

  - type: input
    id: build-identifier
    attributes:
      label: Build / commit
      description: |
        Optional. For development or local builds, provide the commit SHA,
        branch, or other build identifier.
      placeholder: "Example: 8f3c21a / main"
    validations:
      required: false

  - type: dropdown
    id: installation-source
    attributes:
      label: Installation source
      description: Where did you install the application from?
      options:
        - Google Play
        - F-Droid
        - GitHub Releases
        - Other official distribution
        - Local build
        - Unknown
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: |
        Provide the manufacturer and model. For an emulator, provide
        the emulator/device profile.
      placeholder: "Example: Google Pixel 9"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Provide the Android version and API level if known.
      placeholder: "Example: Android 16 (API 36)"
    validations:
      required: true

  - type: input
    id: manufacturer-rom
    attributes:
      label: ROM / manufacturer software
      description: |
        Optional. Provide the ROM, firmware, or manufacturer software
        when relevant.
      placeholder: "Example: One UI / GrapheneOS / LineageOS"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 🔄 Regression

  - type: dropdown
    id: regression
    attributes:
      label: Did this work previously?
      description: Did the affected behavior work correctly in an earlier version?
      options:
        - Unknown
        - No, it never worked correctly
        - Yes, it worked previously
    validations:
      required: true

  - type: input
    id: last-working-version
    attributes:
      label: Last known working version
      description: Optional. If this is a regression, provide the latest known working version.
      placeholder: "Example: 1.3.0"
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 🧪 Diagnostics

        Optional diagnostic information can significantly reduce
        investigation time.

        > ⚠️ Never include passwords, tokens, private keys, personal
        > information, or other sensitive data.

  - type: textarea
    id: logs
    attributes:
      label: Logs / stack trace
      description: |
        Optional. Include the smallest relevant Logcat excerpt, crash
        information, exception message, or stack trace needed to investigate
        the problem. Review diagnostic output before submitting it.
      placeholder: |
        Paste relevant diagnostic output here.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recording
      description: Optional. Attach visual evidence when it helps demonstrate the problem.
      placeholder: |
        Drag and drop screenshots or a screen recording here.
    validations:
      required: false

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Optional. Describe anything that temporarily avoids or reduces the problem.
      placeholder: |
        Restarting the application temporarily resolves the issue.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include relevant configuration, recent changes,
        related Issues, or unusual circumstances.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🔐 Privacy & security

        This issue will normally be public.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public issue confirmation
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this report and its attachments.
          required: true
        - label: I am not publicly disclosing a security vulnerability.
          required: true
    validations:
      required: true
