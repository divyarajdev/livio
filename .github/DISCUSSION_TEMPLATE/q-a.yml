title: "[Question]: "

labels:
  - "question"

body:
  # ===========================================================================
  # 💬 WELCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # 💬 Q&A

        Thanks for reaching out to the community! 💙

        Use this discussion to ask for help **understanding, using,
        configuring, building, or troubleshooting the application**.

        A useful question connects four things:

        **❓ Question → 🎯 Goal → 🧩 Context → 🧪 What you tried**

        ---

        ### 🧭 Before you begin

        Please make sure that you:

        - 🔎 **Search existing Discussions** for related questions and answers.
        - 📚 **Check the current documentation** first.
        - ❓ **State the question clearly** and keep it focused.
        - 🎯 Explain **what you ultimately want to accomplish**.
        - 🧪 Describe **what you have already tried** when relevant.
        - 📱 Add application or Android details only when they affect the answer.
        - 🔍 Include focused errors, logs, screenshots, or other evidence when useful.
        - 🐛 Use **Bug Report** for a reproducible application defect.
        - ✨ Use **Feature Request** for a proposed capability or improvement.
        - 📚 Use **Documentation Report** for missing, incorrect, or unclear documentation.

        > [!WARNING]
        > **Do not publicly disclose security vulnerabilities or sensitive information.**
        > Security-sensitive findings belong in the private reporting process
        > described in `SECURITY.md`. Remove passwords, tokens, API keys,
        > personal information, and other secrets from everything you submit.

  # ===========================================================================
  # ✅ PRE-FLIGHT
  # ===========================================================================

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checklist"
      description: "Confirm that this question is ready for the community."
      options:
        - label: "I searched existing Discussions and did not find a sufficient answer."
          required: true

        - label: "I checked the current documentation before asking."
          required: true

        - label: "This is a question or troubleshooting request, not a confirmed bug, feature request, or documentation report."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true

  # ===========================================================================
  # 1️⃣ QUESTION & GOAL
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1️⃣ ❓ Question & goal

        **What do you need help with, and what are you trying to accomplish?**

        Start with the primary question. Then give enough context for someone
        unfamiliar with your setup to understand why you are asking.

        > [!TIP]
        > Describing the **goal behind the question** can reveal simpler or
        > safer approaches than troubleshooting only the immediate symptom.

  - type: textarea
    id: question
    attributes:
      label: "❓ Question"
      description: |
        State the question as clearly and specifically as possible.

        If several closely related questions are involved, explain how they
        connect to the same goal.
      placeholder: |
        Example:
        How can I configure the application to use a location selected by
        the user for backups on Android?
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: "🎯 Goal"
      description: |
        Describe what you ultimately want to accomplish and what a successful
        outcome would look like.
      placeholder: |
        Example:
        I want backups to be stored in a user-selected location while
        requesting only the permissions required for that workflow.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "🧩 Context"
      description: |
        Provide the background needed to understand the question.

        Include the relevant workflow, situation, or constraints without
        adding unrelated details.
      placeholder: |
        Example:
        I am setting up the application on a new Android device and want
        users to choose where backups are stored.
    validations:
      required: true

  # ===========================================================================
  # 2️⃣ WHAT YOU TRIED
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2️⃣ 🧪 What you tried

        **What approaches have you already tested?**

        This prevents repeated suggestions and often provides the most useful
        clues for troubleshooting.

        Skip this section when the question is purely conceptual.

  - type: textarea
    id: what-tried
    attributes:
      label: "🧪 What have you tried?"
      description: |
        Optional. Describe relevant documentation, settings, commands,
        configuration changes, searches, or other approaches you attempted.

        Include the result of each meaningful attempt.
      placeholder: |
        Example:
        1. Read the storage documentation.
        2. Selected a different storage location.
        3. Granted the permission requested by Android.

        Result:
        The selected location is still unavailable to the application.

  # ===========================================================================
  # 3️⃣ ENVIRONMENT & CONFIGURATION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3️⃣ 📱 Environment & configuration

        **Does your application, Android, device, or configuration affect the question?**

        Environment information is optional for general questions but valuable
        when behavior differs by version, distribution, device, ROM, permission,
        build configuration, or Android API level.

  - type: input
    id: app-version
    attributes:
      label: "📦 App version"
      description: |
        Optional. Provide the exact application version when it may affect
        the answer.
      placeholder: "Example: 1.4.2 (142)"

  - type: input
    id: build-identifier
    attributes:
      label: "🔨 Build / commit"
      description: |
        Optional. For development, nightly, preview, or local builds, provide
        the commit SHA, branch, tag, or another useful identifier.
      placeholder: "Example: 8f3c21a / main / v1.4.2"

  - type: dropdown
    id: installation-source
    attributes:
      label: "📥 Installation source"
      description: "Optional. Where was the affected application build obtained?"
      options:
        - "🛍️ Google Play"
        - "🤖 F-Droid"
        - "🐙 GitHub Releases"
        - "📦 Other official distribution"
        - "🛠️ Local build"
        - "❓ Unknown"

  - type: input
    id: device
    attributes:
      label: "📲 Device"
      description: |
        Optional. Provide the manufacturer and model when device-specific
        behavior may matter.

        For an emulator, provide the virtual device profile.
      placeholder: "Example: Google Pixel 9"

  - type: input
    id: android-version
    attributes:
      label: "🤖 Android version"
      description: |
        Optional. Provide the Android version and API level when known.
      placeholder: "Example: Android 16 (API 36)"

  - type: input
    id: manufacturer-rom
    attributes:
      label: "🧩 ROM / manufacturer software"
      description: |
        Optional. Provide the ROM, firmware, manufacturer skin, or system
        software when it may affect the answer.
      placeholder: "Example: One UI 8 / GrapheneOS / LineageOS"

  - type: textarea
    id: configuration-conditions
    attributes:
      label: "⚙️ Relevant configuration / conditions"
      description: |
        Optional. Describe only the settings or environmental conditions
        that may affect the question.

        Relevant examples include permissions, storage, Android settings,
        build variants, Gradle configuration, network state, integrations,
        lifecycle conditions, accessibility settings, or form factors.
      placeholder: |
        Examples:
        - Permission granted or denied
        - Storage configuration
        - Relevant application setting
        - Background execution state
        - Notification configuration
        - Build variant
        - Network conditions
        - External integration
        - TalkBack enabled
        - Tablet or foldable device

  # ===========================================================================
  # 4️⃣ OBSERVED BEHAVIOR & EVIDENCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4️⃣ 🔍 Observed behavior & evidence

        **What happened, and what evidence helps explain it?**

        If the question involves an error, warning, unexpected result, or
        troubleshooting scenario, provide the smallest useful evidence.

        | Evidence | Useful for |
        |:---:|---|
        | ⚠️ **Exact error** | Identifying the immediate failure |
        | 📋 **Focused logs** | Runtime and diagnostic context |
        | 🖼️ **Screenshot** | Visual or configuration problems |
        | 🎥 **Recording** | Interaction and timing problems |
        | 📎 **Supporting file** | Additional focused diagnostic context |

        > [!CAUTION]
        > Sanitize all diagnostics and uploads first. Remove credentials,
        > account details, identifiers, private paths, personal information,
        > and anything else that should not be public.

  - type: textarea
    id: observed-behavior
    attributes:
      label: "🔍 Error / observed behavior"
      description: |
        Optional. Describe the exact error, warning, unexpected result,
        or behavior you observed.

        Include exact error text when useful, after removing sensitive data.
      placeholder: |
        Example:
        When I select the location, the application reports:

        Permission denied

        and the location remains unavailable.

  - type: textarea
    id: diagnostic-output
    attributes:
      label: "📋 Logs / command output"
      description: |
        Optional. Paste only the diagnostic or command output relevant to
        the question.

        Remove unrelated output and sensitive information first.
      placeholder: |
        Paste the smallest relevant diagnostic excerpt here.
      render: text

  - type: upload
    id: supporting-files
    attributes:
      label: "📎 Supporting files"
      description: |
        Optional. Upload focused screenshots, recordings, logs, documents,
        or archives that directly help explain the question.

        Review every uploaded file for sensitive or identifying information.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm,.log,.txt,.json,.csv,.pdf,.zip,.gz"

  # ===========================================================================
  # 5️⃣ REFERENCES
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5️⃣ 🔗 References

        **What have you already researched?**

        Relevant documentation or prior discussions can help others understand
        your assumptions and avoid repeating information you have already found.

  - type: textarea
    id: references
    attributes:
      label: "🔗 Relevant references"
      description: |
        Optional. Include project documentation, official Android references,
        related Discussions or Issues, specifications, or other useful sources.

        Prefer descriptive link text where practical.
      placeholder: |
        Examples:
        - Relevant project documentation: ...
        - Official Android documentation: ...
        - Related discussion: ...
        - Related issue: ...

  # ===========================================================================
  # 6️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6️⃣ 🔐 Privacy & security

        ### 🌐 Assume everything submitted here is public

        Before posting, review **every part of the discussion**:

        - 📝 Question and context
        - ⚙️ Configuration details
        - 📋 Logs and command output
        - 🔗 Links and references
        - 🖼️ Screenshots
        - 🎥 Screen recordings
        - 📎 Uploaded files

        Remove anything that should not be publicly disclosed.

        > [!IMPORTANT]
        > If your question reveals or depends on a **security vulnerability**,
        > do not post it publicly. Follow the private reporting process
        > described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public discussion confirmation"
      description: "Confirm that this question is safe and appropriate for public discussion."
      options:
        - label: "I reviewed this discussion and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "This discussion does not publicly disclose a security vulnerability."
          required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        # 🏁 Ready to ask?

        A useful Q&A discussion gives the community a clear path toward
        understanding and answering the question:

        | | Question | What it establishes |
        |:---:|---|---|
        | ❓ | **What are you asking?** | The primary question |
        | 🎯 | **What are you trying to achieve?** | The real objective |
        | 🧩 | **What is the context?** | The relevant situation |
        | 🧪 | **What have you tried?** | Existing investigation |
        | 📱 | **What environment matters?** | Version and platform context |
        | 🔍 | **What happened?** | Observed behavior |
        | 📎 | **What evidence exists?** | Diagnostic context |
        | 🔗 | **What have you researched?** | Existing references |
        | 🔐 | **Is it safe to discuss publicly?** | Community protection |

        ### 💬 Answer journey

        **Clear question** → **Real goal** → **Relevant context** →
        **Focused evidence** → **Better answer** 🚀

        ---

        ### 💙 Thank you

        Thank you for asking a clear, focused question and giving the community
        the context it needs to help effectively.
