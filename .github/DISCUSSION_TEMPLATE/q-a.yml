title: "[Question]: "
labels:
  - "question"

body:
  # ===========================================================================
  # 💬 INTRODUCTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # 💬 Q&A

        Thanks for reaching out! 💙

        Use this discussion when you need help **understanding, using,
        configuring, building, or troubleshooting the application**.

        A useful question clearly explains **what you are trying to accomplish**,
        provides the relevant context, and describes what you have already
        tried when applicable.

        ### 🧭 Before you submit

        Please make sure that you:

        - 🔎 **Search existing Discussions** for related questions and answers.
        - 📚 **Check the current documentation** before submitting.
        - 🎯 **Clearly describe what you are trying to accomplish**.
        - 🧪 **Explain what you have already tried** when relevant.
        - 🤖 **Include Android-specific details** only when they affect the question.
        - 🔍 **Include relevant errors or unexpected behavior** when applicable.
        - 📎 **Attach focused screenshots, recordings, logs, or files** when useful.
        - 🐛 Use the **Bug Report** for confirmed reproducible application defects.
        - ✨ Use the **Feature Request** for new functionality or improvements.
        - 📚 Use the **Documentation Report** for incorrect, unclear, missing,
          or outdated documentation.

        > [!TIP]
        > ### 💡 Ask about the goal, not only the symptom
        >
        > Explaining **what you ultimately want to accomplish** often makes it
        > easier for others to suggest the safest and simplest solution.

        > [!WARNING]
        > ### 🔐 Security vulnerabilities
        >
        > **Do not disclose security vulnerabilities in a public Discussion.**
        > Follow the private disclosure process described in `SECURITY.md`.

        > [!IMPORTANT]
        > ### 🛡️ Protect sensitive information
        >
        > Discussions and their attachments are normally **publicly visible**.
        > Remove passwords, authentication tokens, API keys, private keys,
        > personal information, account details, and other sensitive data
        > before submitting.

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checks"
      description: "Confirm that this question is ready for the community."
      options:
        - label: "I searched existing Discussions and did not find a sufficient answer."
          required: true

        - label: "I checked the current documentation before submitting."
          required: true

        - label: "This is a question or troubleshooting request, not a confirmed bug, feature request, or documentation report."
          required: true

        - label: "This discussion does not publicly disclose a security vulnerability."
          required: true
    validations:
      required: true

  # ===========================================================================
  # 1️⃣ QUESTION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. ❓ Question

        Tell us **what you want to understand, accomplish, configure,
        build, or troubleshoot**.

        Keep the primary question focused so other community members can
        quickly understand what kind of help you need.

  - type: textarea
    id: question
    attributes:
      label: "❓ Question"
      description: |
        State your question clearly and specifically.

        If you have multiple closely related questions, explain how they
        connect to the same goal or problem.
      placeholder: |
        Example:
        How can I configure the application to use a user-selected
        storage location on Android?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "🧩 Context"
      description: |
        Describe the situation or background that led to the question.

        Include only information that helps others understand the
        relevant workflow or conditions.
      placeholder: |
        Example:
        I am configuring the application on a new Android device and
        want backups to be stored in a location selected by the user.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: "🎯 Goal"
      description: |
        Optional. Describe what you ultimately want to accomplish and
        what a successful outcome would look like.
      placeholder: |
        Example:
        I want backups to use the selected location without granting
        permissions that are unnecessary for the workflow.
    validations:
      required: false

  # ===========================================================================
  # 2️⃣ WHAT YOU TRIED
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 🧪 What you tried

        Tell us about approaches you have already attempted when relevant.

        This helps avoid repeating suggestions that you already tested
        and provides useful clues about the problem.

  - type: textarea
    id: what-tried
    attributes:
      label: "🧪 What have you tried?"
      description: |
        Optional. Describe the documentation, settings, commands,
        configuration changes, or other approaches you already tried.

        Include the result of each relevant attempt.
      placeholder: |
        Example:
        1. Checked the storage documentation.
        2. Changed the application's storage setting.
        3. Granted the requested Android permission.

        Result:
        The application still cannot access the selected location.
    validations:
      required: false

  # ===========================================================================
  # 3️⃣ APPLICATION ENVIRONMENT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 📦 Application environment

        Provide application details when the **version, build, or
        distribution source** may affect the answer.

  - type: input
    id: app-version
    attributes:
      label: "📦 App version"
      description: |
        Optional. Provide the exact application version when it may
        be relevant to the question.
      placeholder: "Example: 1.4.2 (142)"
    validations:
      required: false

  - type: input
    id: build-identifier
    attributes:
      label: "🔨 Build / commit"
      description: |
        Optional. For development, nightly, or local builds, provide
        the branch, commit SHA, tag, or another useful build identifier.
      placeholder: "Example: 8f3c21a / main"
    validations:
      required: false

  - type: dropdown
    id: installation-source
    attributes:
      label: "📥 Installation source"
      description: "Optional. Where was the application installed from?"
      options:
        - "Google Play"
        - "F-Droid"
        - "GitHub Releases"
        - "Other official distribution"
        - "Local build"
        - "Unknown"
    validations:
      required: false

  # ===========================================================================
  # 4️⃣ ANDROID ENVIRONMENT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 🤖 Android environment

        Include Android environment information when **platform behavior,
        device software, or API-level differences** may affect the answer.

  - type: input
    id: device
    attributes:
      label: "📱 Device"
      description: |
        Optional. Provide the manufacturer and model.

        For an emulator, provide the emulator or virtual device profile.
      placeholder: "Example: Google Pixel 9"
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: "🤖 Android version"
      description: |
        Optional. Provide the Android version and API level when known.
      placeholder: "Example: Android 16 (API 36)"
    validations:
      required: false

  - type: input
    id: manufacturer-rom
    attributes:
      label: "🧩 ROM / manufacturer software"
      description: |
        Optional. Provide the ROM, firmware, Android skin, or manufacturer
        software when it may affect the question.
      placeholder: "Example: One UI / GrapheneOS / LineageOS"
    validations:
      required: false

  - type: textarea
    id: android-context
    attributes:
      label: "🤖 Android-specific context"
      description: |
        Optional. Include platform details that may influence the answer,
        such as permissions, storage behavior, lifecycle rules, background
        execution, notifications, intents, accessibility, form factors,
        or manufacturer-specific restrictions.
      placeholder: |
        Examples:
        - Runtime permission state
        - Scoped storage behavior
        - Background execution restrictions
        - Notification settings
        - Activity or service lifecycle
        - Intent or URI behavior
        - TalkBack or accessibility behavior
        - Font scaling or display-size behavior
        - Tablet, foldable, or large-screen behavior
        - Device or manufacturer restrictions
    validations:
      required: false

  # ===========================================================================
  # 5️⃣ CONFIGURATION & CONDITIONS
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. ⚙️ Configuration & conditions

        Include configuration details only when they help explain
        **why the question or behavior occurs in your environment**.

  - type: textarea
    id: configuration-conditions
    attributes:
      label: "⚙️ Configuration / conditions"
      description: |
        Optional. Describe relevant application settings, Android settings,
        permissions, build configuration, network conditions, integrations,
        files, or other environmental conditions.
      placeholder: |
        Examples:
        - Application settings
        - Android system settings
        - Permissions granted or denied
        - Build variant
        - Gradle configuration
        - Network state
        - External service or integration
    validations:
      required: false

  # ===========================================================================
  # 6️⃣ OBSERVED BEHAVIOR
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🔍 Observed behavior

        If your question involves an error, warning, or unexpected behavior,
        describe **exactly what you observed**.

  - type: textarea
    id: error-observed
    attributes:
      label: "🔍 Error / observed behavior"
      description: |
        Optional. Include relevant error messages, warnings, unexpected
        results, or other observations.

        Include exact error text when practical, but remove sensitive
        information before submitting.
      placeholder: |
        Example:
        The application displays:

        Permission denied

        when attempting to access the selected location.
    validations:
      required: false

  # ===========================================================================
  # 7️⃣ EVIDENCE & ATTACHMENTS
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 📎 Evidence & attachments

        Provide **focused supporting material** when it helps explain
        the question or observed behavior.

        > [!CAUTION]
        > Review all logs, screenshots, recordings, configuration files,
        > command output, and other attachments before submitting.
        >
        > Remove credentials, identifiers, personal information, and other
        > sensitive data.

  - type: textarea
    id: diagnostic-output
    attributes:
      label: "📋 Logs / command output"
      description: |
        Optional. Paste short, relevant logs, error output, or command
        output here.

        Remove unrelated output and sanitize sensitive information first.
      placeholder: |
        Paste focused diagnostic or command output here.
    validations:
      required: false

  - type: upload
    id: supporting-files
    attributes:
      label: "📎 Supporting files"
      description: |
        Optional. Attach screenshots, screen recordings, logs, configuration
        files, documents, or other material that directly helps explain
        the question.

        GitHub will apply its supported file-type and size restrictions.
    validations:
      required: false

  # ===========================================================================
  # 8️⃣ REFERENCES
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🔗 References

        Add documentation or other references that may help explain
        **what you have already researched or which behavior you expect**.

  - type: textarea
    id: references
    attributes:
      label: "🔗 References"
      description: |
        Optional. Include relevant project documentation, official Android
        documentation, related Discussions or Issues, specifications,
        examples, or other useful sources.

        Use descriptive link text where possible.
      placeholder: |
        Examples:
        - Relevant project documentation: ...
        - Official Android documentation: ...
        - Related discussion: ...
    validations:
      required: false

  # ===========================================================================
  # 9️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🔐 Privacy & security

        ### 🌐 Remember: this Discussion is public

        Discussions and their attachments are normally visible to anyone
        who can access the repository.

        Before submitting, review:

        - 📝 Discussion text
        - ⚙️ Configuration details
        - 💻 Logs and command output
        - 🔗 Links and references
        - 🖼️ Screenshots
        - 🎥 Screen recordings
        - 📎 Uploaded files

        > [!IMPORTANT]
        > If your question reveals or depends on a **security vulnerability**,
        > do not submit it publicly. Follow the private reporting process
        > described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public discussion confirmation"
      description: "Confirm that this question is appropriate for public disclosure."
      options:
        - label: "I reviewed this discussion and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true
    validations:
      required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 🏁 Ready to ask?

        ### 💡 A useful Q&A discussion answers these questions

        | | Question | Why it matters |
        |:---:|---|---|
        | ❓ | **What are you asking?** | Defines the question |
        | 🧩 | **What is the context?** | Explains the situation |
        | 🎯 | **What are you trying to achieve?** | Clarifies the real goal |
        | 🧪 | **What have you tried?** | Avoids repeated suggestions |
        | 📦 | **Which app environment is involved?** | Identifies version-specific behavior |
        | 🤖 | **Which Android environment is involved?** | Identifies platform-specific behavior |
        | 🔍 | **What happened?** | Captures errors or unexpected results |
        | 📎 | **What evidence is available?** | Helps others diagnose the situation |
        | 🔗 | **What references are relevant?** | Shows existing research |
        | 🔐 | **Can it be discussed safely?** | Protects you and the project |

        > **Clear question → relevant context → useful evidence → better answer.** 🚀

        Thank you for providing clear, focused, and relevant information. 💙
