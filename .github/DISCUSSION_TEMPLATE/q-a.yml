title: "[Q&A] "

body:
  # Introduction
  - type: markdown
    attributes:
      value: |
        ## Android Q&A

        Use this Discussion category to ask questions about using, configuring,
        integrating, building, or understanding this Android project.

        Please keep the Discussion focused on one main question and include
        enough context to understand what you are trying to do.

        - Include Android or development details only when they are relevant.
        - Use the bug-report process for confirmed reproducible bugs.
        - Use the Feature Request form or Ideas category for suggestions and proposed behavior changes.

        > **Privacy and security:** Do not post passwords, API keys, access tokens,
        > signing secrets, private URLs, personal information, or security vulnerabilities.

  # Lightweight pre-posting check
  - type: checkboxes
    id: before-posting
    attributes:
      label: Before posting
      options:
        - label: I searched existing Discussions and checked the available documentation before asking this question.
          required: true

  # Question classification
  - type: dropdown
    id: topic
    attributes:
      label: What is your question about?
      description: Choose the area that best matches your question.
      options:
        - Getting started
        - Using the app
        - Configuration
        - Android integration
        - SDK or library usage
        - Kotlin or Java
        - Jetpack Compose or UI
        - Activity, Fragment, or lifecycle
        - Navigation
        - State management
        - Storage or database
        - Networking or synchronization
        - Authentication or accounts
        - Permissions
        - Notifications
        - Background work or services
        - Media, camera, or files
        - Build, Gradle, or Android Studio
        - Testing
        - Performance or battery
        - Architecture or design
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  # Core question
  - type: textarea
    id: question
    attributes:
      label: What is your question?
      description: Describe the help you need as clearly as possible.
      placeholder: |
        What are you trying to understand, configure, or accomplish?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Provide enough background to understand your question.
      placeholder: |
        Useful details may include:

        - What you are trying to build or configure
        - How you are using this project
        - Relevant requirements or limitations
        - Why you chose your current approach
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Share what you have already checked, tested, or researched.
      placeholder: |
        For example:

        - Documentation I checked:
        - Approaches I tried:
        - Related Discussions or Issues:
        - What I am still unsure about:

  # Project usage
  - type: dropdown
    id: usage
    attributes:
      label: How are you using the project?
      options:
        - Using the Android app
        - Integrating the library or SDK
        - Developing the project from source
        - Building a custom version
        - Using a sample or demo
        - Maintaining a fork
        - Evaluating or learning the project
        - Other
        - Not applicable

  - type: input
    id: version
    attributes:
      label: Project, app, or library version
      description: Provide the relevant version, release tag, or commit when applicable.
      placeholder: "Example: 2.4.1, v3.0.0-beta2, or commit abc1234"

  # Android and development context
  - type: textarea
    id: android-context
    attributes:
      label: Android context
      description: Add Android or device details only when they are relevant.
      placeholder: |
        Android version or API level:
        Device or emulator:
        Manufacturer or model:
        Relevant Android setting:
        Relevant permission state:

  - type: textarea
    id: development-environment
    attributes:
      label: Development environment
      description: For development, integration, or build questions, include only relevant versions.
      placeholder: |
        Android Studio:
        Kotlin:
        Java or JDK:
        Gradle:
        Android Gradle Plugin:
        compileSdk:
        targetSdk:
        minSdk:
        Jetpack Compose BOM:
        Relevant dependencies:

  # Supporting information
  - type: textarea
    id: code
    attributes:
      label: Relevant code, logs, or configuration
      description: |
        Share the smallest relevant example if it helps explain the question.

        Use fenced code blocks with an appropriate language identifier.
      placeholder: |
        Add the smallest relevant Kotlin, Java, Gradle, Manifest, XML,
        Compose, ProGuard/R8, log, or configuration excerpt.

  - type: textarea
    id: references
    attributes:
      label: Related references
      description: Add documentation, Discussions, Issues, examples, or other useful references.
      placeholder: |
        Documentation:
        Related Discussion:
        Related Issue:
        Example project:
        Other reference:

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else?
      description: Add any other information that may help answer your question.
      placeholder: |
        Screenshots, constraints, observations, or any other useful context.

  # Closing
  - type: markdown
    attributes:
      value: |
        Thanks for providing the relevant details.

        I may ask for additional information if something important is missing.

        If you find the solution yourself, add it to the Discussion so it is
        available to future readers.

        If a response resolves your question, please mark it as the answer.
