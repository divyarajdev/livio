title: "[Question]: "
labels:
  - question

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## 💬 Q&A

        Use this form when you need help understanding, using,
        configuring, building, or troubleshooting the application.

        Please provide enough information to understand your question,
        reproduce relevant conditions when necessary, and provide
        an accurate and useful answer.

        ### Before you submit

        - 🔎 Search existing Discussions for related questions.
        - 📚 Check the current documentation before submitting.
        - 🎯 Clearly describe what you are trying to accomplish.
        - 🧪 Explain what you have already tried and what happened.
        - 🤖 Provide Android-specific details when they affect the question.
        - 🔍 Include relevant errors or unexpected behavior when applicable.
        - 📎 Attach relevant screenshots, recordings, logs, or files when useful.
        - 🔐 Remove passwords, tokens, private keys, personal information,
          and other sensitive data.
        - 🛡️ Do not publicly disclose security vulnerabilities.
        - 🐛 Use the Bug Report for confirmed reproducible application defects.
        - ✨ Use the Feature Request for new functionality or improvements.
        - 📚 Use the Documentation report for missing, incorrect, unclear,
          or outdated documentation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm these items before submitting.
      options:
        - label: I searched existing Discussions and did not find a sufficient answer.
          required: true
        - label: I checked the current documentation before submitting.
          required: true
        - label: I clearly described my question, context, and goal.
          required: true
        - label: I explained what I have already tried and what happened.
          required: true
        - label: I provided relevant Android environment information.
          required: true
        - label: This is a question or request for guidance, not a confirmed bug or feature request.
          required: true
        - label: This discussion does not publicly disclose a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # QUESTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. ❓ Question

        Clearly describe what you want to understand, accomplish,
        configure, or troubleshoot.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: |
        State your question clearly and specifically.

        If there are multiple questions, explain how they are related.
      placeholder: |
        Example:
        How can I configure the application to use a different
        storage location on Android?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: |
        Describe the situation or background that led to the question.

        Include only information relevant to understanding the situation.
      placeholder: |
        Example:
        I am configuring the application on a new Android device
        and want to store backups in a user-selected location.
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: |
        Describe what you are trying to accomplish and what a
        successful outcome would look like.
      placeholder: |
        Example:
        I want backups to be stored in the selected location
        without granting unnecessary permissions.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # WHAT YOU TRIED
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 🧪 What you tried

        Explain what you have already attempted.

        This helps avoid repeating approaches that did not work.

  - type: textarea
    id: what-tried
    attributes:
      label: What have you tried?
      description: |
        Describe the documentation, settings, commands, configuration
        changes, or other approaches you have already tried.

        Include the result of each relevant attempt.

        If you have not tried anything yet, state that explicitly.
      placeholder: |
        Example:
        1. Checked the storage documentation.
        2. Changed the application storage setting.
        3. Granted the requested Android permission.

        Result:
        The application still cannot access the selected location.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # APPLICATION ENVIRONMENT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 📦 Application environment

        Provide the application version and installation source
        used when the question or behavior occurred.

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Provide the exact application version.
      placeholder: "Example: 1.4.2 (142)"
    validations:
      required: true

  - type: dropdown
    id: installation-source
    attributes:
      label: Installation source
      description: Where did you install the application from?
      options:
        - Google Play
        - F-Droid
        - GitHub Releases
        - Other official distribution
        - Local build
        - Unknown
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # ANDROID ENVIRONMENT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 🤖 Android environment

        Provide Android environment information when it can affect
        the question or observed behavior.

  - type: input
    id: device
    attributes:
      label: Device
      description: |
        Provide the manufacturer and model.
        For an emulator, provide the emulator/device profile.
      placeholder: "Example: Google Pixel 9"
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: Provide the Android version and API level when known.
      placeholder: "Example: Android 16 (API 36)"
    validations:
      required: true

  - type: input
    id: manufacturer-rom
    attributes:
      label: ROM / manufacturer software
      description: |
        Optional. Provide the ROM, firmware, or manufacturer software
        when it may affect the question.
      placeholder: "Example: One UI / GrapheneOS / LineageOS"
    validations:
      required: false

  - type: textarea
    id: android-context
    attributes:
      label: Android-specific context
      description: |
        Optional. Include relevant Android platform details such as
        API-level behavior, permissions, storage, lifecycle, background
        execution, notifications, intents, accessibility, or
        manufacturer-specific restrictions.
      placeholder: |
        Examples:
        - Runtime permission state
        - Scoped storage behavior
        - Background execution restrictions
        - Notification settings
        - Activity/service lifecycle
        - Intent or URI behavior
        - Accessibility behavior
        - Device or manufacturer restrictions
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONFIGURATION & CONDITIONS
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. ⚙️ Configuration & conditions

        Include configuration details only when they are relevant
        to understanding the question.

  - type: textarea
    id: configuration-conditions
    attributes:
      label: Configuration / conditions
      description: |
        Optional. Describe relevant application settings, Android settings,
        permissions, build configuration, network conditions, files,
        integrations, or other conditions.
      placeholder: |
        Examples:
        - Application settings
        - Android system settings
        - Permissions granted or denied
        - Build variant
        - Gradle configuration
        - Network state
        - External service or integration
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # OBSERVED BEHAVIOR
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🔍 Observed behavior

        If your question involves an error or unexpected behavior,
        describe exactly what you observed.

  - type: textarea
    id: error-observed
    attributes:
      label: Error / observed behavior
      description: |
        Optional. Include error messages, warnings, unexpected behavior,
        or other observations relevant to the question.

        Include exact error text when possible.
      placeholder: |
        Example:
        The application displays "Permission denied" when attempting
        to access the selected location.

        If there is an error message, include the exact text when possible.
      render: text
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # EVIDENCE & ATTACHMENTS
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 📎 Evidence & attachments

        Provide supporting material when it helps explain the question.

        You may attach screenshots, screen recordings, logs,
        command output, configuration files, or other relevant files.

        Review all attachments before submitting and remove
        sensitive information.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: |
        Optional. Add relevant evidence or attach files here.
      placeholder: |
        Add screenshots, recordings, logs, command output,
        configuration files, or other relevant evidence.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # REFERENCES
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🔗 References

        Include relevant documentation or other material when useful.

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Optional. Include relevant documentation, official Android
        references, related Discussions, Issues, examples, or other
        useful sources.
      placeholder: |
        Add relevant references here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🔐 Privacy & security

        Discussions are normally public.

        Review all text, configuration details, logs, screenshots,
        recordings, links, and attachments before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public discussion confirmation
      description: Confirm that this question is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this discussion and its attachments.
          required: true
        - label: I am not publicly disclosing a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful Q&A?

        **What are you asking? → What is the context? → What is your goal?**
        **→ What have you tried? → Which application and Android environment**
        **are involved? → What happened? → What evidence or references**
        **can help explain the situation?**

        Thank you for providing clear, relevant, and complete information.
