title: "[Q&A]: "

body:
  # Purpose and routing
  - type: markdown
    attributes:
      value: |
        Use this category for technical questions about using, configuring, integrating, building, or understanding the Android project.

        Limit each Discussion to one technical question.
        Use the Bug Report form for reproducible defects.
        Use the Feature Request form for scoped capability or behavior changes that are ready for project triage.
        Use the Documentation Request form for documentation corrections or additions.
        Use the Ideas category to explore early-stage proposals.

        > **Public content:** Do not disclose security vulnerabilities. Remove credentials,
        > authentication tokens, private endpoints, personal data, and other sensitive data
        > from all text and attachments.

  # Search prerequisite
  - type: checkboxes
    id: before-posting
    attributes:
      label: Search prerequisite
      options:
        - label: I searched existing Discussions, Issues, and project documentation for this question or an existing solution.
          required: true

  # Question classification
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: Select the closest technical area.
      options:
        - Getting started or app usage
        - Project configuration
        - Android integration
        - SDK or library usage
        - Kotlin or Java
        - UI or Jetpack Compose
        - Lifecycle or state management
        - Navigation
        - Storage or database
        - Networking or synchronization
        - Authentication or accounts
        - Permissions
        - Notifications
        - Background work or services
        - Media, camera, or files
        - Build, Gradle, or Android Studio
        - Testing
        - Performance or battery
        - Architecture or design
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  # Required question details
  - type: textarea
    id: question
    attributes:
      label: Technical question
      description: State one question and the specific result you need.
      placeholder: |
        What behavior, API, configuration, or implementation do you need help with?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Technical context
      description: Provide the objective, current approach, constraints, and observed behavior relevant to the question.
      placeholder: |
        Objective:
        Current approach:
        Constraints:
        Observed behavior:
    validations:
      required: true

  # Investigation
  - type: textarea
    id: tried
    attributes:
      label: Investigation performed
      description: List the documentation, tests, and approaches already evaluated, including their results.
      placeholder: |
        Documentation reviewed:
        Tests or experiments:
        Results:
        Remaining uncertainty:

  # Project context
  - type: dropdown
    id: usage
    attributes:
      label: Usage mode
      description: Select how the project is being used.
      options:
        - Android app user
        - SDK or library consumer
        - Source contributor
        - Custom build
        - Sample or demo
        - Fork maintainer
        - Evaluation or learning
        - Other
        - Not applicable

  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Provide the relevant app or library version, release tag, or commit SHA when applicable.
      placeholder: "Example: 2.4.1, v3.0.0-beta2, or abc1234"

  # Runtime context
  - type: textarea
    id: android-context
    attributes:
      label: Android runtime
      description: Complete this field for device-specific, operating-system-specific, or permission-related questions.
      placeholder: |
        Android version or API level:
        Device or emulator:
        Manufacturer or model:
        Android distribution or ROM:
        Relevant permissions or settings:

  # Build context
  - type: textarea
    id: development-environment
    attributes:
      label: Build environment
      description: Complete this field for source, build, dependency, SDK, or Jetpack Compose questions.
      placeholder: |
        Android Studio:
        Kotlin:
        JDK:
        Gradle:
        Android Gradle Plugin:
        compileSdk:
        targetSdk:
        minSdk:
        Jetpack Compose BOM:
        Relevant dependencies:

  # Technical evidence
  - type: textarea
    id: code
    attributes:
      label: Minimal code, logs, or configuration
      description: Include only the excerpt required to explain the question. Use fenced code blocks with the appropriate language identifier.
      placeholder: |
        Add the smallest relevant Kotlin, Java, Gradle, Manifest, XML,
        Compose, ProGuard/R8, configuration, or log excerpt.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link documentation, Discussions, Issues, specifications, or reproductions relevant to the question.
      placeholder: |
        Documentation:
        Related Discussion or Issue:
        Specification:
        Reproduction:

  - type: textarea
    id: additional-context
    attributes:
      label: Additional evidence
      description: Attach screenshots or recordings, or add constraints and observations not represented above.

  # Resolution
  - type: markdown
    attributes:
      value: |
        If you resolve the question, post the solution and mark the resolving response as the answer.
