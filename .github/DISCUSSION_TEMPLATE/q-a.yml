title: "[Q&A]: "

body:
  # Purpose and routing
  - type: markdown
    attributes:
      value: |
        ## Android Q&A

        Use this category for technical questions about project usage, configuration, integration, source builds, or architecture.

        - Limit each discussion to one question.
        - Use the Bug Report form for reproducible defects.
        - Use the Feature Request form for scoped change proposals.
        - Use the Ideas category for early-stage proposals and exploration.

        > **Public content:** Do not disclose security vulnerabilities. Remove credentials,
        > API keys, authentication tokens, signing material, private endpoints, and personal
        > data from all text and attachments.

  # Search prerequisite
  - type: checkboxes
    id: prerequisite
    attributes:
      label: Prerequisite
      options:
        - label: I searched existing discussions, issues, and project documentation.
          required: true

  # Classification
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      description: Select the closest technical area.
      options:
        - Getting started or app usage
        - Project configuration
        - Android integration
        - SDK or library usage
        - Kotlin or Java
        - UI or Jetpack Compose
        - Lifecycle or state management
        - Navigation
        - Storage or database
        - Networking or sync
        - Authentication or accounts
        - Permissions
        - Notifications
        - Background work or services
        - Media, camera, or files
        - Build, Gradle, or Android Studio
        - Testing
        - Performance or battery
        - Architecture or design
        - Accessibility
        - Documentation
        - Other
    validations:
      required: true

  # Required question details
  - type: textarea
    id: question
    attributes:
      label: Technical question
      description: State the question and the specific result you need.
      placeholder: |
        What behavior, API, configuration, or implementation do you need help with?
    validations:
      required: true

  - type: textarea
    id: technical-context
    attributes:
      label: Technical context
      description: Provide the architecture, constraints, current approach, and observed behavior relevant to the question.
      placeholder: |
        Objective:
        Current approach:
        Constraints:
        Observed behavior:
    validations:
      required: true

  - type: textarea
    id: investigation
    attributes:
      label: Investigation performed
      description: List the documentation, tests, and approaches already evaluated.
      placeholder: |
        Documentation:
        Tests or experiments:
        Results:
        Remaining uncertainty:

  # Project context
  - type: dropdown
    id: usage-mode
    attributes:
      label: Usage mode
      description: Select how the project is being used.
      options:
        - Android app user
        - SDK or library consumer
        - Source contributor
        - Custom build
        - Sample or demo
        - Fork maintainer
        - Evaluation or learning
        - Other
        - Not applicable

  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Provide the relevant app or library version, release tag, or commit SHA.
      placeholder: "Example: 2.4.1, v3.0.0-beta2, or abc1234"

  # Runtime context
  - type: textarea
    id: android-runtime
    attributes:
      label: Android runtime
      description: Complete this field for device- or OS-specific questions.
      placeholder: |
        Android/API level:
        Device/emulator:
        Manufacturer/model:
        Permissions or settings:

  # Build context
  - type: textarea
    id: build-environment
    attributes:
      label: Build environment
      description: Complete this field for source, build, Compose, or dependency questions.
      placeholder: |
        Android Studio:
        Kotlin:
        JDK:
        Gradle:
        AGP:
        compileSdk:
        targetSdk:
        minSdk:
        Compose BOM:
        Relevant dependencies:

  # Technical evidence
  - type: textarea
    id: technical-evidence
    attributes:
      label: Minimal code, logs, or configuration
      description: Include only the excerpt required to reproduce or explain the question. Use fenced code blocks with the correct language identifier.
      placeholder: |
        Paste the minimal relevant code, log output, Gradle configuration,
        manifest entry, XML, Compose code, or ProGuard/R8 rule.

  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant documentation, discussions, issues, or reproductions.
      placeholder: |
        Documentation:
        Related discussion or issue:
        Reproduction:

  - type: textarea
    id: additional-evidence
    attributes:
      label: Additional evidence
      description: Add constraints, screenshots, recordings, or observations not captured above.

  # Resolution
  - type: markdown
    attributes:
      value: |
        If you resolve the question, post the solution and mark the resolving response as the answer.
