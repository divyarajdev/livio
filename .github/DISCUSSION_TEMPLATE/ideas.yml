title: "[Idea]: "

body:
  # Purpose and routing
  - type: markdown
    attributes:
      value: |
        Use this category to explore improvements, new capabilities, workflow changes,
        UI concepts, or other ways this Android project could evolve.

        Describe the problem or opportunity before proposing implementation.
        A complete technical solution is not required.
        Limit each Discussion to one idea.

        Use the Bug Report form for reproducible defects.
        Use the Feature Request form for scoped capability or behavior changes that are ready for project triage.
        Use the Documentation Request form for documentation corrections or additions.
        Use the Q&A category for questions about usage, configuration, integration, builds, or troubleshooting.

        > **Public content:** Do not disclose security vulnerabilities. Remove credentials,
        > authentication tokens, private endpoints, personal data, and other sensitive data
        > from all text and attachments.

  # Search prerequisite
  - type: checkboxes
    id: before-posting
    attributes:
      label: Search prerequisite
      options:
        - label: I searched existing Discussions, Issues, and project documentation for this idea or an existing solution.
          required: true

  # Idea classification
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the area most directly related to the idea.
      options:
        - Getting started or onboarding
        - App experience
        - UI or Jetpack Compose
        - Navigation
        - Accessibility
        - Configuration or customization
        - Android integration
        - Developer API or SDK
        - Storage or database
        - Networking or synchronization
        - Authentication or accounts
        - Permissions or privacy
        - Notifications
        - Background work or services
        - Media, camera, or files
        - Performance or battery
        - Architecture or developer experience
        - Build, Gradle, or tooling
        - Testing
        - Documentation
        - Other
    validations:
      required: true

  # Core idea
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: Describe the improvement, capability, or direction you want the Discussion to explore.
      placeholder: |
        Describe the idea in its current form.

        What could the project support, improve, or do differently?
    validations:
      required: true

  # Motivation and use case
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and example scenario
      description: Explain what prompted the idea, why it may be useful, and a scenario where it could help.
      placeholder: |
        Current situation:
        Problem or opportunity:
        Example scenario:
        Who or what may benefit:
        Why it matters:
    validations:
      required: true

  # Possible direction
  - type: textarea
    id: proposed-experience
    attributes:
      label: Possible experience
      description: Describe a possible user experience, API, configuration, or workflow. The direction may remain incomplete.
      placeholder: |
        The app could:
        A setting could:
        An API could:
        A workflow could:
        Unresolved questions:

  # Existing approaches
  - type: textarea
    id: alternatives
    attributes:
      label: Existing approaches or alternatives
      description: List known features, workarounds, APIs, libraries, or alternative directions.
      placeholder: |
        Existing feature or workaround:
        Relevant Android API:
        Comparable app or library:
        Alternative direction:

  # Known considerations
  - type: textarea
    id: considerations
    attributes:
      label: Known considerations
      description: Share only considerations already known. A complete technical analysis is not required.
      placeholder: |
        Android versions or API constraints:
        UI, form-factor, or accessibility considerations:
        Permissions, privacy, or security:
        Performance, battery, network, or storage:
        SDK, API, or build implications:
        Compatibility or migration:
        Other known tradeoffs:

  # Supporting material
  - type: textarea
    id: references
    attributes:
      label: Examples and supporting material
      description: Link or attach related Discussions, Issues, documentation, research, mockups, recordings, or comparable implementations.
      placeholder: |
        Related Discussion or Issue:
        Documentation or research:
        Comparable app or library:
        Mockup, screenshot, or recording:
        Example repository:
