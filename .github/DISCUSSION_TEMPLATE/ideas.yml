title: "[Idea]: "
labels:
  - idea

body:
  # ---------------------------------------------------------------------------
  # BEFORE YOU SUBMIT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ## 💡 Idea

        Use this form to discuss an early idea, concept, or potential
        improvement before it becomes a formal feature request.

        Ideas may still be incomplete or open to alternative approaches,
        but they should provide enough information for the project to
        understand the problem, evaluate the potential value, and discuss
        the direction responsibly.

        ### Before you submit

        - 🔎 Search existing Issues and Discussions for related ideas.
        - 📚 Check the current documentation and existing features first.
        - 🎯 Clearly describe the problem, opportunity, or unmet need.
        - 💡 Describe the idea and intended outcome.
        - 📊 Explain who benefits and why the idea may be valuable.
        - 🔄 Describe alternatives, existing workarounds, or limitations.
        - 🎨 Describe the expected user experience when relevant.
        - ❓ Identify important questions, uncertainties, or trade-offs.
        - 📱 Include Android-specific details when they affect the idea.
        - 🔧 Include relevant technical constraints when they affect feasibility.
        - 📎 Attach screenshots, mockups, diagrams, examples, or evidence when useful.
        - 🔐 Remove passwords, authentication tokens, private keys, personal information,
          and other sensitive data.
        - 🛡️ Do not publicly disclose security vulnerabilities.
        - ✨ Use the Feature Request when the proposal is sufficiently defined
          for formal evaluation.
        - 🐛 Use the Bug Report for confirmed reproducible application defects.
        - 💬 Use Q&A for questions, guidance, or troubleshooting.
        - 📚 Use the Documentation report for missing, incorrect, unclear,
          or outdated documentation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-submission checks
      description: Please confirm all items before submitting.
      options:
        - label: I searched existing Issues and Discussions and did not find a duplicate.
          required: true
        - label: I checked the current documentation and existing features before submitting.
          required: true
        - label: I clearly described the problem, opportunity, or unmet need behind this idea.
          required: true
        - label: I clearly described the idea and intended outcome.
          required: true
        - label: I explained who may benefit and why the idea may be valuable.
          required: true
        - label: I considered relevant alternatives, limitations, or existing workarounds.
          required: true
        - label: This is an early-stage idea or concept, not a confirmed bug, documentation issue, Q&A question, or formal feature request.
          required: true
        - label: This discussion does not publicly disclose a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # PROBLEM / OPPORTUNITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 1. 🎯 Problem / opportunity

        Explain the underlying problem, unmet need, limitation,
        or opportunity that led to the idea.

  - type: textarea
    id: problem
    attributes:
      label: Problem / opportunity
      description: |
        Describe what is currently difficult, missing, inefficient,
        limiting, or worth improving.

        Focus on the underlying need rather than the implementation.
      placeholder: |
        Example:
        Users who frequently manage large collections may need
        a faster way to organize related items.
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: |
        Describe the workflow, scenario, or situation in which
        the problem or opportunity occurs.

        Explain who is affected, when the need arises,
        and what they are trying to accomplish.
      placeholder: |
        Example:
        A user managing a large collection may need to organize
        many related items during routine maintenance.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # IDEA
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 2. 💡 Idea

        Describe the concept or direction you would like
        the project to explore.

  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: |
        Describe the proposed concept, capability, workflow,
        or direction.

        The idea does not need to define the final implementation,
        but it should be specific enough to discuss meaningfully.
      placeholder: |
        Example:
        Explore a way for users to group related items and
        perform common organizational actions more efficiently.
    validations:
      required: true

  - type: textarea
    id: intended-outcome
    attributes:
      label: Intended outcome
      description: |
        Describe what should improve if the idea were adopted.

        Focus on the user or project outcome rather than
        implementation details.
      placeholder: |
        Example:
        Users should be able to complete common organizational
        tasks with fewer repetitive steps.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # VALUE & IMPACT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 3. 📊 Value & impact

        Explain why the idea may be useful and who could benefit.

  - type: textarea
    id: beneficiaries
    attributes:
      label: Beneficiaries
      description: |
        Identify the users, workflows, or use cases that would
        benefit from the idea.
      placeholder: |
        Example:
        Users who frequently manage large collections.
    validations:
      required: true

  - type: textarea
    id: evidence-impact
    attributes:
      label: Evidence / impact
      description: |
        Provide evidence supporting the idea where possible.

        Include user feedback, frequency, measurable impact,
        related requests, examples, existing limitations,
        or other relevant evidence.

        If no evidence is currently available, explain why.
      placeholder: |
        Examples:
        - This affects a frequent workflow.
        - The current process requires many repetitive steps.
        - Similar requests have appeared in Discussions.
        - Users have reported difficulty with the current workflow.
        - No direct evidence is currently available because this is an early concept.
    validations:
      required: true

  - type: dropdown
    id: usage-frequency
    attributes:
      label: Expected usage frequency
      description: How frequently might this idea be useful?
      options:
        - Several times a day
        - Daily
        - Weekly
        - Occasionally
        - Rarely
        - Unsure
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # EXPECTED USER EXPERIENCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 4. 🎨 Expected user experience

        Describe how the idea could work from the user's perspective.

  - type: textarea
    id: expected-ux
    attributes:
      label: Expected UX
      description: |
        Describe the expected user flow, interaction, feedback,
        states, or observable behavior.

        The final design may change during discussion.
      placeholder: |
        Example:
        1. Select multiple related items.
        2. Choose an organizational action.
        3. Review the selected items.
        4. Confirm the action when necessary.
        5. The application clearly communicates the result.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # ALTERNATIVES
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 5. 🔄 Alternatives & considerations

        Explain existing approaches and other directions
        that could be considered.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        Describe existing features, workarounds, alternative ideas,
        or approaches you considered.

        Explain their advantages, limitations, or unresolved problems.
      placeholder: |
        Example:
        The current workflow handles individual items well,
        but does not scale efficiently when many items need
        the same action.
    validations:
      required: true

  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: |
        Identify important questions, uncertainties, trade-offs,
        risks, or design decisions that should be discussed.

        If there are no known open questions, state that explicitly.
      placeholder: |
        Examples:
        - Should this apply to all item types?
        - Should the action require confirmation?
        - Are there Android platform restrictions to consider?
        - What should happen when some selected items cannot be processed?
        - No significant open questions are currently known.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # ANDROID CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 6. 🤖 Android context

        Provide Android-specific information when it affects
        the idea or its feasibility.

  - type: textarea
    id: android-context
    attributes:
      label: Android-specific context
      description: |
        Required only when Android-specific behavior affects the idea.

        If no Android-specific considerations are known, state that explicitly.

        Include relevant API levels, permissions, storage behavior,
        lifecycle behavior, background execution, notifications,
        accessibility, device behavior, or platform restrictions.
      placeholder: |
        Examples:
        - Android/API level requirements
        - Runtime permissions
        - Scoped storage
        - Background execution restrictions
        - Notification behavior
        - Android lifecycle behavior
        - Accessibility requirements
        - Device/manufacturer-specific behavior
        - No known Android-specific considerations.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # TECHNICAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 7. 🔧 Technical context

        Add technical information when it affects feasibility,
        compatibility, performance, security, or project scope.

  - type: textarea
    id: technical-context
    attributes:
      label: Technical considerations
      description: |
        Describe relevant APIs, dependencies, compatibility requirements,
        performance considerations, architecture, storage, network,
        integrations, or other constraints.

        Do not prescribe an implementation unless the technical
        detail is necessary for discussion.

        If no technical considerations are known, state that explicitly.
      placeholder: |
        Examples:
        - Required Android APIs
        - Existing application components
        - Backward compatibility
        - Performance considerations
        - Network or storage requirements
        - Integration requirements
        - No known technical considerations.
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # REFERENCES & ADDITIONAL CONTEXT
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 8. 🔗 References & additional context

        Provide supporting material that helps others understand,
        evaluate, or discuss the idea.

  - type: textarea
    id: references
    attributes:
      label: References
      description: |
        Optional. Include related Issues, Discussions, documentation,
        examples, specifications, research, or other relevant sources.
      placeholder: |
        Add relevant references here.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: |
        Optional. Include screenshots, mockups, diagrams, examples,
        design notes, research, or other information that may help
        explain the idea.
      placeholder: |
        Add any additional relevant information here.
    validations:
      required: false

  # ---------------------------------------------------------------------------
  # CONTRIBUTION
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 9. 🤝 Contribution

        Contributions are welcome when an idea is accepted for
        further development and follows the project's standards.

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Optional.
      options:
        - label: I am willing to help develop, test, document, or further refine this idea if it is accepted.
          required: false

  # ---------------------------------------------------------------------------
  # PRIVACY & SECURITY
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ## 10. 🔐 Privacy & security

        Discussions are normally public.

        Review all text, links, screenshots, mockups, examples,
        and attachments before submitting.

  - type: checkboxes
    id: privacy
    attributes:
      label: Public discussion confirmation
      description: Confirm that this discussion is safe to disclose publicly.
      options:
        - label: I have removed passwords, authentication tokens, private keys, personal information, and other sensitive data from this discussion and its attachments.
          required: true
        - label: I am not publicly disclosing a security vulnerability.
          required: true
    validations:
      required: true

  # ---------------------------------------------------------------------------
  # FINAL GUIDANCE
  # ---------------------------------------------------------------------------

  - type: markdown
    attributes:
      value: |
        ---

        ### 💡 What makes a useful idea?

        **What is the problem or opportunity? → Who is affected? → What is**
        **the idea? → What outcome could it provide? → What evidence supports**
        **the need? → What alternatives exist? → What questions or trade-offs**
        **matter? → What Android or technical constraints should be considered?**

        Thank you for providing clear, relevant, and constructive information
        that helps the project evaluate early ideas before deciding whether
        they should become formal feature requests.
