title: "[Idea]: "

labels:
  - "idea"

body:
  # ===========================================================================
  # 💡 WELCOME
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        # 💡 Idea

        Thanks for helping explore ways to make the project better! 💙

        Use this Discussion for an **early idea, opportunity, concept, or
        potential improvement** that would benefit from community exploration
        before becoming a formal Feature Request.

        You do **not** need a complete design or implementation plan.

        A useful idea simply connects:

        **🎯 Need → 💡 Direction → ✨ Outcome → 💬 Discussion**

        ---

        ### 🧭 Before you begin

        Please make sure that you:

        - 🔎 **Search existing Issues and Discussions** for similar ideas.
        - 📚 **Check current features and documentation** first.
        - 🎯 Explain the **problem, opportunity, or unmet need**.
        - 💡 Describe the **direction worth exploring**, not necessarily a final solution.
        - ✨ Explain **what should improve** if the idea succeeds.
        - 📊 Add evidence or impact information when it helps establish value.
        - 🎨 Describe possible UX only when interaction or behavior matters.
        - ❓ Leave room for **alternatives, questions, and trade-offs**.
        - 🤖 Add Android-specific details only when platform behavior matters.
        - 🔧 Add technical constraints only when they affect feasibility or scope.
        - ✨ Use **Feature Request** when the proposal is sufficiently defined for formal evaluation.
        - 🐛 Use **Bug Report** for reproducible application defects.
        - 💬 Use **Q&A** for questions, help, and troubleshooting.
        - 📚 Use **Documentation Report** for documentation problems.

        > [!WARNING]
        > **Do not publicly disclose security vulnerabilities or sensitive information.**
        > Security-sensitive findings belong in the private reporting process
        > described in `SECURITY.md`. Remove passwords, tokens, API keys,
        > personal information, and other secrets from everything you submit.

  # ===========================================================================
  # ✅ PRE-FLIGHT
  # ===========================================================================

  - type: checkboxes
    id: preflight
    attributes:
      label: "✅ Pre-submission checklist"
      description: "Confirm that this idea is ready for community discussion."
      options:
        - label: "I searched existing Issues and Discussions and did not find a duplicate."
          required: true

        - label: "I checked the current features and documentation before submitting."
          required: true

        - label: "This is an exploratory idea, not a confirmed bug, support question, or documentation report."
          required: true

        - label: "I am not publicly disclosing a security vulnerability."
          required: true

  # ===========================================================================
  # 1️⃣ PROBLEM & IDEA
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 1️⃣ 💡 Problem & idea

        **What is worth improving, and what direction should we explore?**

        Start with the underlying need or opportunity, then describe the idea.

        > [!TIP]
        > Early ideas are welcome. You do not need to resolve every detail.
        > A strong starting point identifies something meaningful to improve
        > while leaving room for alternative solutions.

  - type: dropdown
    id: idea-type
    attributes:
      label: "🧭 Idea type"
      description: "Which direction best describes the idea?"
      options:
        - "✨ New capability"
        - "🛠️ Existing feature improvement"
        - "🎨 User experience improvement"
        - "♿ Accessibility improvement"
        - "⚡ Performance or efficiency improvement"
        - "🔗 Compatibility or integration improvement"
        - "🔄 Workflow improvement"
        - "💡 Other idea"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "🎯 Problem / opportunity"
      description: |
        Explain what is difficult, missing, inefficient, inaccessible,
        confusing, limiting, or otherwise worth improving.

        Focus on the underlying need rather than prescribing a solution.
      placeholder: |
        Example:
        Users who regularly manage large collections may need a faster
        and less repetitive way to organize related items.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: "💡 Idea"
      description: |
        Describe the concept, capability, workflow, behavior, or direction
        you think is worth exploring.

        It should be specific enough for meaningful discussion without
        requiring a final implementation.
      placeholder: |
        Example:
        Explore a way for users to work with related items as a group
        when performing common organizational actions.
    validations:
      required: true

  - type: textarea
    id: intended-outcome
    attributes:
      label: "✨ Intended outcome"
      description: |
        Explain what should become easier, clearer, faster, safer, or
        otherwise better if the idea succeeds.

        Focus on the outcome rather than implementation details.
      placeholder: |
        Example:
        Users should be able to complete common organization workflows
        with fewer repetitive actions while retaining clear control over
        the affected items.
    validations:
      required: true

  # ===========================================================================
  # 2️⃣ USE CASE & VALUE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 2️⃣ 🧩 Use case & value

        **Who might benefit, when would it matter, and why is it useful?**

        This section is intentionally optional. Early ideas do not need a
        formal business case or prioritization analysis.

  - type: textarea
    id: use-case
    attributes:
      label: "🧩 Use case"
      description: |
        Optional. Describe a workflow or situation where the idea would help.

        Explain who may encounter the need, when it appears, and what they
        are trying to accomplish.
      placeholder: |
        Example:
        A user maintaining a large collection may periodically need to
        reorganize many related items during routine maintenance.

  - type: textarea
    id: beneficiaries
    attributes:
      label: "👥 Who could benefit?"
      description: |
        Optional. Identify users, workflows, environments, or scenarios
        that may benefit from this direction.
      placeholder: |
        Example:
        Users who frequently organize or maintain large collections.

  - type: textarea
    id: evidence-impact
    attributes:
      label: "📊 Evidence / potential impact"
      description: |
        Optional. Add context that helps demonstrate the need or possible value.

        Useful examples include frequency, workflow cost, community feedback,
        related requests, observed friction, or current limitations.
      placeholder: |
        Examples:
        - The current workflow requires many repetitive actions.
        - This task occurs frequently.
        - Other Discussions describe a similar need.
        - The limitation becomes significant with larger collections.

  # ===========================================================================
  # 3️⃣ EXPERIENCE, ALTERNATIVES & QUESTIONS
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 3️⃣ 🎨 Experience, alternatives & open questions

        **What might this look like, and what still needs exploration?**

        Ideas are more useful when the community can compare possible
        approaches instead of converging too early on one implementation.

  - type: textarea
    id: expected-ux
    attributes:
      label: "🎨 Possible user experience"
      description: |
        Optional. Describe one possible user flow, interaction model,
        navigation pattern, feedback mechanism, or observable behavior.

        This is exploratory and may change substantially during discussion.
      placeholder: |
        Example:
        1. Select related items.
        2. Choose an available group action.
        3. Review what will be affected.
        4. Confirm when necessary.
        5. Receive clear feedback about the result.

  - type: textarea
    id: alternatives
    attributes:
      label: "🔀 Alternatives / existing approaches"
      description: |
        Optional. Describe existing features, workarounds, alternative ideas,
        or other approaches worth comparing.

        Include advantages or limitations when known.
      placeholder: |
        Example:
        Processing each item individually already works, but it becomes
        inefficient when the same action must be repeated many times.

  - type: textarea
    id: open-questions
    attributes:
      label: "❓ Open questions / trade-offs"
      description: |
        Optional. Identify uncertainties, risks, competing priorities, or
        design decisions that would benefit from community discussion.
      placeholder: |
        Examples:
        - Which item types should support this?
        - Which actions should require confirmation?
        - What happens if only part of an operation succeeds?
        - How should this behave with accessibility services?
        - Are there Android platform restrictions?
        - Would this introduce meaningful complexity for occasional users?

  # ===========================================================================
  # 4️⃣ PLATFORM & TECHNICAL CONTEXT
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 4️⃣ 🤖 Platform & technical context

        **Are there constraints that materially affect this idea?**

        Platform and implementation details are welcome when they help
        understand feasibility, compatibility, performance, privacy,
        security, accessibility, or scope.

        They are **context**, not a requirement to design the final architecture.

  - type: textarea
    id: android-context
    attributes:
      label: "🤖 Android-specific context"
      description: |
        Optional. Add Android requirements or limitations only when they
        materially affect the idea.

        Relevant areas include API levels, permissions, lifecycle behavior,
        storage, background execution, notifications, accessibility,
        system integrations, form factors, and manufacturer behavior.
      placeholder: |
        Examples:
        - Minimum Android/API requirements
        - Runtime permissions
        - Scoped storage
        - Background execution restrictions
        - Notification behavior
        - Activity or process lifecycle
        - TalkBack behavior
        - Font or display scaling
        - Tablet, foldable, or large-screen behavior
        - Manufacturer-specific limitations

  - type: textarea
    id: technical-context
    attributes:
      label: "🔧 Technical considerations"
      description: |
        Optional. Add known technical factors that may help the discussion.

        Possible areas include APIs, architecture, dependencies, integrations,
        compatibility, storage, networking, migrations, memory, or performance.
      placeholder: |
        Examples:
        - Relevant Android or platform APIs
        - Existing application components
        - External integrations
        - Backward compatibility
        - Data migration implications
        - Performance or memory considerations
        - Network or storage requirements

  # ===========================================================================
  # 5️⃣ REFERENCES & SUPPORTING MATERIAL
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 5️⃣ 🔗 References & supporting material

        **Is there anything that makes the idea easier to understand,
        compare, or visualize?**

        Useful material can include related discussions, existing issues,
        platform documentation, research, screenshots, diagrams, mockups,
        or examples from comparable workflows.

  - type: textarea
    id: references
    attributes:
      label: "🔗 References"
      description: |
        Optional. Include related Issues, Discussions, project documentation,
        Android documentation, specifications, research, or other useful sources.

        Prefer descriptive link text where practical.
      placeholder: |
        Examples:
        - Related discussion: ...
        - Related issue: #123
        - Relevant Android documentation: ...
        - Supporting specification or research: ...

  - type: upload
    id: supporting-files
    attributes:
      label: "🖼️ Mockups / screenshots / supporting files"
      description: |
        Optional. Upload focused screenshots, mockups, diagrams, recordings,
        or documents that help explain or visualize the idea.

        Review every file for personal, identifying, confidential, or
        sensitive information before uploading.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.svg,.webp,.mp4,.mov,.webm,.pdf"

  - type: textarea
    id: additional-context
    attributes:
      label: "📝 Additional context"
      description: |
        Optional. Add assumptions, edge cases, historical context, research,
        design notes, or anything else that may help the community explore
        the idea constructively.
      placeholder: |
        Add any additional relevant context here.

  # ===========================================================================
  # 6️⃣ COMMUNITY PARTICIPATION
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 6️⃣ 🤝 Community participation

        **Interested in helping if this direction moves forward?**

        Ideas may evolve substantially through discussion before any
        implementation begins.

        > [!NOTE]
        > Offering to help is not a commitment and does not imply that the
        > idea will be accepted or implemented in its current form.

  - type: checkboxes
    id: contribution
    attributes:
      label: "🤝 Contribution interest"
      description: "Optional — indicate whether you may be interested in helping."
      options:
        - label: "I may be willing to help refine, design, implement, test, or document this idea if it moves forward."
          required: false

  # ===========================================================================
  # 7️⃣ PRIVACY & SECURITY
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        ## 7️⃣ 🔐 Privacy & security

        ### 🌐 Assume everything submitted here is public

        Before posting, review **every part of the Discussion**:

        - 📝 Discussion text
        - 🔗 Links and references
        - 🖼️ Screenshots and mockups
        - 🎨 Diagrams and design material
        - 🎥 Screen recordings
        - 📄 Documents
        - 📎 Other uploaded files

        Remove anything that should not be publicly disclosed.

        > [!IMPORTANT]
        > If this idea reveals, demonstrates, or depends on a **security
        > vulnerability**, do not post it publicly. Follow the private
        > reporting process described in `SECURITY.md`.

  - type: checkboxes
    id: privacy
    attributes:
      label: "🛡️ Public discussion confirmation"
      description: "Confirm that this idea is safe and appropriate for public discussion."
      options:
        - label: "I reviewed this Discussion and its attachments and removed passwords, authentication tokens, API keys, private keys, personal information, and other sensitive data."
          required: true

        - label: "This Discussion does not publicly disclose a security vulnerability."
          required: true

  # ===========================================================================
  # 🏁 FINAL GUIDANCE
  # ===========================================================================

  - type: markdown
    attributes:
      value: |
        ---

        # 🏁 Ready to discuss?

        A useful idea gives the community enough context to explore a direction
        without pretending every decision has already been made:

        | | Question | What it establishes |
        |:---:|---|---|
        | 🎯 | **What could be improved?** | The underlying need |
        | 💡 | **What direction is worth exploring?** | The core idea |
        | ✨ | **What could become better?** | The intended outcome |
        | 🧩 | **When would it matter?** | The real-world use case |
        | 📊 | **Why might it be valuable?** | Potential impact |
        | 🎨 | **How might it work?** | One possible experience |
        | 🔀 | **What alternatives exist?** | Solution space |
        | ❓ | **What remains unresolved?** | Discussion opportunities |
        | 🤖 | **What platform constraints matter?** | Android considerations |
        | 🔧 | **What technical factors matter?** | Feasibility context |
        | 🔐 | **Is it safe to discuss publicly?** | Community protection |

        ### 🌱 Idea journey

        **Meaningful need** → **Promising direction** → **Open discussion** →
        **Refined proposal** → **Formal Feature Request** 🚀

        ---

        ### 💙 Thank you

        Thank you for bringing an idea to the community and leaving room
        for others to question, refine, expand, or improve it.
